function AnimNumber({value,prefix='',suffix='',duration=800}){
  const [display,setDisplay]=useState(0);
  useEffect(()=>{
    let start=0;const end=value;const st=Date.now();
    const tick=()=>{const elapsed=Date.now()-st;const progress=Math.min(elapsed/duration,1);const eased=1-Math.pow(1-progress,3);setDisplay(Math.floor(eased*end));if(progress<1)requestAnimationFrame(tick)};
    tick();
  },[value]);
  return <span>{prefix}{fmt(display)}{suffix}</span>;
}

}

function DeadlineCountdown({year,filingMonth}){
  // 경정청구 기한: 법정신고기한 + 5년
  const filingDate = new Date(year+1, filingMonth, 0); // 신고기한(해당 월 말일)
  const deadline = new Date(year+6, filingMonth, 0); // 경정청구 기한(법정신고기한+5년)
  const now = new Date();
  const daysLeft = Math.ceil((deadline - now)/(1000*60*60*24));
  const isExpired = daysLeft <= 0;
  const isUrgent = daysLeft > 0 && daysLeft <= 180;

  return(
    <div style={{display:'flex',alignItems:'center',gap:6}}>
      {isExpired ? (
        <Badge color="var(--ng)" bg="var(--ng1)"><i className="fas fa-times-circle" style={{marginRight:3}}/>기한 만료</Badge>
      ) : isUrgent ? (
        <Badge color="var(--wn)" bg="var(--wn1)"><i className="fas fa-exclamation-triangle" style={{marginRight:3}}/>D-{daysLeft}</Badge>
      ) : (
        <Badge color="var(--ok)" bg="var(--ok1)"><i className="fas fa-clock" style={{marginRight:3}}/>D-{daysLeft}</Badge>
      )}
    </div>
  );
}

// ═══ 계산 로직 (강화) ═══
function calcResult(taxType, form){
  const items = DEDUCTIONS[taxType].items;
  const indData = INDUSTRY_RATES[form.industry] || INDUSTRY_RATES['기타'];
  const taxPaid = form.taxPaid;
  const years = form.years;
  const revenue = form.revenue;
  const employees = form.employees;

  // 업종·규모별 보정계수
  const sizeFactor = revenue > 1000000000 ? 1.2 : revenue > 500000000 ? 1.0 : 0.8;
  const empFactor = employees > 20 ? 1.15 : employees > 10 ? 1.05 : employees > 5 ? 0.95 : 0.85;

  const details = items.map(item => {
    const base = taxPaid * item.rate * sizeFactor;
    let refund = Math.min(base, item.maxAmt);

    // 항목별 세부 보정
    if(item.id.includes('2') && employees < 3) refund *= 0.3; // 고용증대는 직원 수 영향
    if(item.id.includes('4') && form.industry !== '정보통신' && form.industry !== '제조업') refund *= 0.4; // R&D는 업종 영향
    if(item.id.includes('1')) refund *= empFactor; // 특별감면은 규모 영향

    // 연도별 가중치
    const yearWeight = years.length * 0.82;
    const adjusted = Math.round(refund * yearWeight * (0.65 + Math.random() * 0.35));

    // 적용 가능성 판정
    const probBase = item.priority === 'high' ? 0.78 : item.priority === 'medium' ? 0.55 : 0.35;
    const applicable = Math.random() < probBase;

    return { ...item, refund: applicable ? adjusted : 0, applicable, probBase: Math.round(probBase * 100) };
  });

  const applicableDetails = details.filter(d => d.applicable && d.refund > 0);
  const totalRefund = applicableDetails.reduce((a, d) => a + d.refund, 0);

  // 연도별 분배 (최근 연도에 가중치)
  const yearWeights = years.map((y, i) => 0.7 + (i / years.length) * 0.6);
  const weightSum = yearWeights.reduce((a, b) => a + b, 0);
  const byYear = years.map((y, i) => {
    const amount = Math.round(totalRefund * yearWeights[i] / weightSum);
    const filingMonth = DEDUCTIONS[taxType].filingMonth;
    const deadline = new Date(y + 6, filingMonth, 0);
    const now = new Date();
    const daysLeft = Math.ceil((deadline - now) / (1000 * 60 * 60 * 24));
    return { year: y, amount, daysLeft, expired: daysLeft <= 0 };
  }).filter(y => !y.expired);

  const adjustedTotal = byYear.reduce((a, y) => a + y.amount, 0);

  // 환급 가능성
  const probability = Math.min(95, Math.max(15,
    indData.prob
    + (employees > 10 ? 8 : employees > 5 ? 4 : 0)
    + (taxPaid > 50000000 ? 10 : taxPaid > 20000000 ? 5 : 0)
    + (years.length >= 4 ? 6 : years.length >= 2 ? 3 : 0)
    + (applicableDetails.filter(d => d.priority === 'high').length * 3)
  ));

  // 리스크 평가
  const riskLevel = probability >= 70 ? 'low' : probability >= 45 ? 'medium' : 'high';

  // 환급가산금 예상 (평균 180일 기준, 연 3.1% 일할계산)
  const estimatedInterest = Math.round(adjustedTotal * REFUND_INTEREST_ANNUAL * 180 / 365);

  // 성과보수 예상 (환급금의 20% 기준)
  const estimatedFee = Math.round(adjustedTotal * 0.20);
  const netRefund = adjustedTotal - estimatedFee + estimatedInterest;

  return {
    totalRefund: adjustedTotal,
    details: applicableDetails,
    allDetails: details,
    byYear,
    probability,
    riskLevel,
    industry: form.industry,
    avgIndustry: indData.avgRefund,
    estimatedInterest,
    estimatedFee,
    netRefund,
    topItem: applicableDetails.length > 0 ? applicableDetails.sort((a, b) => b.refund - a.refund)[0] : null,
  };
}

// ═══ 분석 중 ═══
function Analyzing({taxType}){
  const [step,setStep]=useState(0);
  const taxInfo = DEDUCTIONS[taxType];
  const steps=[
    `${taxInfo.label} 납세 이력 조회 중...`,
    `${taxInfo.items.length}개 공제·감면 항목 분석 중...`,
    '누락 세액공제 교차검증 중...',
    '업종별 환급 통계 대조 중...',
    '환급 예상액 최종 산출 중...',
  ];
  useEffect(()=>{const iv=setInterval(()=>setStep(p=>p<steps.length-1?p+1:p),550);return()=>clearInterval(iv)},[]);
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0A1628,#162848)'}}>
      <div className="fu" style={{textAlign:'center',maxWidth:400,padding:24}}>
        <div style={{width:100,height:100,borderRadius:30,background:'rgba(2,103,255,.1)',display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:32,position:'relative'}}>
          <i className={`fas ${taxInfo.icon}`} style={{color:taxInfo.color,fontSize:40}}/>
          <div style={{position:'absolute',inset:-4,borderRadius:34,border:'3px solid transparent',borderTopColor:taxInfo.color,animation:'spin 1s linear infinite'}}/>
        </div>
        <h2 style={{color:'#fff',fontSize:24,fontWeight:800,marginBottom:12}}>AI 환급 분석 중</h2>
        <p className="fi" key={step} style={{color:taxInfo.color,fontSize:14,fontWeight:700,marginBottom:32}}>{steps[step]}</p>
        <ProgressBar pct={(step+1)/steps.length*100} color={taxInfo.color} height={6}/>
        <p style={{color:'var(--g4)',fontSize:12,marginTop:16}}>잠시만 기다려주세요...</p>
      </div>
    </div>
  );
}

  const tabs = [
    {id:'overview',label:'환급 요약',icon:'fa-chart-pie'},
    {id:'details',label:'공제 상세',icon:'fa-list-check'},
    {id:'timeline',label:'연도별 분석',icon:'fa-calendar-alt'},
    {id:'money',label:'수익 분석',icon:'fa-calculator'},
    {id:'docs',label:'필요 서류',icon:'fa-folder-open'},
    {id:'faq',label:'자주 묻는 질문',icon:'fa-circle-question'},
  ];

  return(
    <div style={{minHeight:'100vh',background:'var(--g0)'}}>
      {/* 상단 결과 배너 */}
      <div style={{background:hasRefund?'linear-gradient(135deg,#0A1628,#0C2340)':'var(--g1)',padding:'48px 24px 40px'}}>
        <div className="fu" style={{maxWidth:800,margin:'0 auto',textAlign:'center'}}>
          {hasRefund?(
            <>
              <div className="pop" style={{width:80,height:80,borderRadius:24,background:'rgba(0,196,140,.12)',display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:20}}>
                <i className="fas fa-coins" style={{color:'var(--ok)',fontSize:32}}/>
              </div>
              <p style={{color:'var(--ok)',fontSize:14,fontWeight:700,marginBottom:8}}><i className="fas fa-circle-check" style={{marginRight:6}}/>환급 가능 금액이 발견되었습니다!</p>
              <p style={{color:'#fff',fontSize:48,fontWeight:800,letterSpacing:-1}}>
                <AnimNumber value={result.totalRefund} suffix="원"/>
              </p>
              <p style={{color:'var(--g4)',fontSize:14,marginTop:12}}>
                {formData.bizType==='개인'||taxType==='wage'?'':'법인'} {taxInfo.label} · {formData.industry} · {result.details.length}개 공제항목 · {result.byYear.length}개 귀속연도
              </p>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,marginTop:16,flexWrap:'wrap'}}>
                <div style={{display:'inline-flex',alignItems:'center',gap:6,background:result.riskLevel==='low'?'rgba(0,196,140,.15)':result.riskLevel==='medium'?'rgba(255,184,0,.15)':'rgba(255,71,87,.15)',padding:'8px 16px',borderRadius:99}}>
                  <i className={`fas ${result.riskLevel==='low'?'fa-shield-check':result.riskLevel==='medium'?'fa-exclamation-triangle':'fa-triangle-exclamation'}`} style={{color:result.riskLevel==='low'?'var(--ok)':result.riskLevel==='medium'?'var(--wn)':'var(--ng)'}}/>
                  <span style={{color:result.riskLevel==='low'?'var(--ok)':result.riskLevel==='medium'?'var(--wn)':'var(--ng)',fontSize:13,fontWeight:700}}>환급 가능성 {result.probability}%</span>
                </div>
                <div style={{display:'inline-flex',alignItems:'center',gap:6,background:'rgba(2,103,255,.15)',padding:'8px 16px',borderRadius:99}}>
                  <i className="fas fa-piggy-bank" style={{color:'var(--p)'}}/>
                  <span style={{color:'var(--p)',fontSize:13,fontWeight:700}}>실수령 예상 {fmtW(result.netRefund)}원</span>
                </div>
              </div>
            </>
          ):(
            <>
              <i className="fas fa-circle-info" style={{fontSize:40,color:'var(--g3)',marginBottom:16}}/>
              <h2 style={{fontSize:24,fontWeight:800}}>추가 환급 항목이 없습니다</h2>
              <p style={{color:'var(--g4)',marginTop:8}}>입력하신 정보 기준으로 누락된 공제항목이 없습니다.</p>
              <p style={{color:'var(--g4)',fontSize:13,marginTop:4}}>다른 세목이나 조건으로 다시 진단해보세요.</p>
            </>
          )}
        </div>
      </div>

      {hasRefund&&(
        <div style={{maxWidth:800,margin:'0 auto',padding:'0 24px 80px'}}>
          {/* 탭 네비게이션 */}
          <div className="no-print" style={{display:'flex',gap:4,padding:'20px 0 24px',overflowX:'auto',msOverflowStyle:'none',scrollbarWidth:'none'}}>
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{padding:'10px 16px',borderRadius:12,border:'none',background:activeTab===t.id?'var(--p)':'#fff',color:activeTab===t.id?'#fff':'var(--g5)',fontWeight:700,fontSize:12,cursor:'pointer',whiteSpace:'nowrap',transition:'all .2s',boxShadow:activeTab===t.id?'0 4px 12px rgba(2,103,255,.2)':'0 1px 3px rgba(0,0,0,.05)'}}>
                <i className={`fas ${t.icon}`} style={{marginRight:6}}/>{t.label}
              </button>
            ))}
          </div>

          {/* 탭 내용 */}
          {activeTab==='overview'&&<OverviewTab result={result} taxInfo={taxInfo} formData={formData} taxType={taxType}/>}
          {activeTab==='details'&&<DetailsTab result={result} taxInfo={taxInfo}/>}
          {activeTab==='timeline'&&<TimelineTab result={result} taxInfo={taxInfo} taxType={taxType}/>}
          {activeTab==='money'&&<MoneyTab result={result} taxInfo={taxInfo} formData={formData}/>}
          {activeTab==='docs'&&<DocsTab docs={docs} taxInfo={taxInfo}/>}
          {activeTab==='faq'&&<FaqTab/>}

          {/* 하단 CTA */}
          <div className="no-print" style={{marginTop:32}}>
            {/* 경정청구 진행 절차 */}
            <div className="fu" style={{background:taxInfo.gradient,borderRadius:24,padding:32,color:'#fff',marginBottom:20}}>
              <h3 style={{fontWeight:800,fontSize:18,marginBottom:16}}><i className="fas fa-file-signature" style={{marginRight:8}}/>경정청구 진행 절차</h3>
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                {[
                  {step:'1',title:'무료 진단 완료',desc:`AI 시스템으로 ${result.details.length}개 누락 공제항목을 확인했습니다`,done:true},
                  {step:'2',title:'전문가 정밀 검토',desc:'세무사가 실제 적용 가능 여부와 법적 근거를 검토합니다',done:false},
                  {step:'3',title:'경정청구서 작성·접수',desc:'국세청 제출용 경정청구서와 증빙서류를 작성·접수합니다',done:false},
                  {step:'4',title:'국세청 심사 (2~3개월)',desc:'담당 세무서에서 경정청구서를 심사합니다',done:false},
                  {step:'5',title:'환급금 입금 + 환급가산금',desc:`승인 후 통장으로 환급금이 입금됩니다 (가산금 약 ${fmtW(result.estimatedInterest)}원)`,done:false},
                ].map(s=>(
                  <div key={s.step} style={{display:'flex',alignItems:'center',gap:14}}>
                    <div style={{width:36,height:36,borderRadius:12,background:s.done?'var(--ok)':'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      {s.done?<i className="fas fa-check" style={{fontSize:12}}/>:<span style={{fontWeight:800,fontSize:14}}>{s.step}</span>}
                    </div>
                    <div>
                      <p style={{fontWeight:700,fontSize:14}}>{s.title}</p>
                      <p style={{fontSize:12,opacity:.7}}>{s.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* 주의사항 */}
            <div style={{background:'var(--p1)',borderRadius:20,padding:24,marginBottom:20,border:'1px solid rgba(2,103,255,.1)'}}>
              <p style={{fontSize:12,fontWeight:700,color:'var(--p2)',marginBottom:8}}><i className="fas fa-info-circle" style={{marginRight:6}}/>안내사항</p>
              <ul style={{fontSize:12,color:'var(--g5)',lineHeight:2,paddingLeft:16}}>
                <li>본 결과는 입력하신 정보를 기반으로 한 <b>예상 시뮬레이션</b>입니다.</li>
                <li>실제 환급금은 세무전문가 검토 후 확정됩니다.</li>
                <li>경정청구 기한: 법정신고기한으로부터 <b>5년 이내</b> (국세기본법 §45의2)</li>
                <li>성과보수 방식: 환급 성공 시에만 수수료가 발생합니다.</li>
                <li>경정청구 자체는 세무조사 사유에 해당하지 않습니다.</li>
                <li>환급가산금(이자): 연 3.1% (2026년 기준, 국세기본법 시행규칙 §19의3)</li>
              </ul>
            </div>

            {/* CTA 버튼 */}
            <div style={{display:'flex',gap:12}}>
              <button onClick={onRetry} className="btn-s" style={{flex:1}}>
                <i className="fas fa-rotate-right" style={{marginRight:6}}/>다시 진단
              </button>
              <button onClick={()=>window.print()} className="btn-s" style={{flex:1}}>
                <i className="fas fa-print" style={{marginRight:6}}/>인쇄
              </button>
              <button onClick={()=>alert('세무법인 한백택스에 경정청구 상담을 요청합니다.\n\n📞 02-XXX-XXXX\n📧 tax@hanbaek.co.kr')} className="btn-p" style={{flex:2}}>
                <i className="fas fa-phone" style={{marginRight:8}}/>전문가 상담 요청
              </button>
            </div>
          </div>
        </div>
      )}

      {!hasRefund&&(
        <div style={{maxWidth:700,margin:'0 auto',padding:'40px 24px',textAlign:'center'}}>
          <button onClick={onRetry} className="btn-s" style={{marginRight:12}}>다른 조건으로 진단</button>
          <button onClick={onReset} className="btn-p">처음으로</button>
        </div>
      )}
    </div>
  );
}

// ═══ 결과 탭 컴포넌트들 ═══

function OverviewTab({result,taxInfo,formData,taxType}){
  return(
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      {/* 핵심 지표 4개 */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}} className="grid-2">
        {[
          {label:'총 예상 환급금',value:fmtW(result.totalRefund)+'원',icon:'fa-coins',color:'var(--ok)',bg:'var(--ok1)'},
          {label:'환급 가능성',value:result.probability+'%',icon:'fa-chart-line',color:'var(--p)',bg:'var(--p1)'},
          {label:'적용 공제항목',value:result.details.length+'개',icon:'fa-list-check',color:'var(--ac)',bg:'var(--ac1)'},
          {label:'실수령 예상',value:fmtW(result.netRefund)+'원',icon:'fa-piggy-bank',color:'var(--violet)',bg:'var(--violet1)'},
        ].map((m,i)=>(
          <div key={i} className="card" style={{textAlign:'center',padding:20}}>
            <div style={{width:40,height:40,borderRadius:12,background:m.bg,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:10}}>
              <i className={`fas ${m.icon}`} style={{color:m.color,fontSize:16}}/>
            </div>
            <p style={{fontSize:11,fontWeight:700,color:'var(--g4)',marginBottom:4}}>{m.label}</p>
            <p style={{fontSize:22,fontWeight:800,color:m.color}}>{m.value}</p>
          </div>
        ))}
      </div>

      {/* 리스크 평가 */}
      <div className="card">
        <h3 style={{fontWeight:800,fontSize:16,marginBottom:16}}><i className="fas fa-shield-halved" style={{color:result.riskLevel==='low'?'var(--ok)':result.riskLevel==='medium'?'var(--wn)':'var(--ng)',marginRight:8}}/>환급 가능성 분석</h3>
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16}}>
          <div style={{flex:1}}>
            <ProgressBar pct={result.probability} color={result.riskLevel==='low'?'var(--ok)':result.riskLevel==='medium'?'var(--wn)':'var(--ng)'} height={12}/>
          </div>
          <span style={{fontWeight:800,fontSize:24,color:result.riskLevel==='low'?'var(--ok)':result.riskLevel==='medium'?'var(--wn)':'var(--ng)'}}>{result.probability}%</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
          {[
            {label:'높은 우선순위 항목',value:result.details.filter(d=>d.priority==='high').length+'개',positive:result.details.filter(d=>d.priority==='high').length>0},
            {label:'대상 귀속연도',value:result.byYear.length+'년',positive:result.byYear.length>=3},
            {label:'업종 환급 비율',value:(INDUSTRY_RATES[formData.industry]||INDUSTRY_RATES['기타']).prob+'%',positive:(INDUSTRY_RATES[formData.industry]||INDUSTRY_RATES['기타']).prob>=40},
          ].map((f,i)=>(
            <div key={i} style={{background:'var(--g0)',borderRadius:12,padding:12,textAlign:'center'}}>
              <p style={{fontSize:10,fontWeight:700,color:'var(--g4)',marginBottom:4}}>{f.label}</p>
              <p style={{fontSize:16,fontWeight:800,color:f.positive?'var(--ok)':'var(--g5)'}}>{f.value}</p>
            </div>
          ))}
        </div>
        <div style={{marginTop:16,padding:14,background:result.riskLevel==='low'?'var(--ok1)':result.riskLevel==='medium'?'var(--wn1)':'var(--ng1)',borderRadius:12}}>
          <p style={{fontSize:12,fontWeight:700,color:result.riskLevel==='low'?'var(--ok)':result.riskLevel==='medium'?'var(--wn)':'var(--ng)'}}>
            <i className={`fas ${result.riskLevel==='low'?'fa-circle-check':result.riskLevel==='medium'?'fa-exclamation-circle':'fa-triangle-exclamation'}`} style={{marginRight:6}}/>
            {result.riskLevel==='low'?'환급 가능성이 높습니다. 전문가 검토를 권장합니다.':result.riskLevel==='medium'?'부분적 환급 가능성이 있습니다. 정밀 검토가 필요합니다.':'환급 가능성이 낮으나 일부 항목은 검토 가치가 있습니다.'}
          </p>
        </div>
      </div>

      {/* 업종 비교 */}
      <div className="card">
        <h3 style={{fontWeight:800,fontSize:16,marginBottom:16}}><i className="fas fa-chart-pie" style={{color:'var(--ac)',marginRight:8}}/>업종 내 비교</h3>
        <div style={{display:'grid',gridTemplateColumns:'1fr 40px 1fr',gap:8,alignItems:'center'}}>
          <div style={{background:'var(--g0)',borderRadius:16,padding:20,textAlign:'center'}}>
            <p style={{fontSize:11,fontWeight:700,color:'var(--g4)',marginBottom:6}}>{formData.industry} 평균 환급금</p>
            <p style={{fontSize:24,fontWeight:800,color:'var(--g5)'}}>{fmtW(result.avgIndustry)}원</p>
          </div>
          <div style={{textAlign:'center'}}>
            <i className={`fas ${result.totalRefund>result.avgIndustry?'fa-arrow-right':'fa-arrow-left'}`} style={{color:'var(--p)',fontSize:16}}/>
          </div>
          <div style={{background:result.totalRefund>result.avgIndustry?'var(--ok1)':'var(--p1)',borderRadius:16,padding:20,textAlign:'center'}}>
            <p style={{fontSize:11,fontWeight:700,color:'var(--g4)',marginBottom:6}}>회원님 예상 환급금</p>
            <p style={{fontSize:24,fontWeight:800,color:result.totalRefund>result.avgIndustry?'var(--ok)':'var(--p)'}}>{fmtW(result.totalRefund)}원</p>
          </div>
        </div>
        {result.totalRefund>result.avgIndustry&&(
          <div style={{marginTop:12,background:'var(--ok1)',borderRadius:12,padding:'10px 16px',display:'flex',alignItems:'center',gap:8}}>
            <i className="fas fa-arrow-trend-up" style={{color:'var(--ok)'}}/>
            <span style={{fontSize:12,fontWeight:700,color:'var(--ok)'}}>업종 평균 대비 {fmt(result.totalRefund-result.avgIndustry)}원 (+{Math.round((result.totalRefund/result.avgIndustry-1)*100)}%) 높음</span>
          </div>
        )}
      </div>

      {/* TOP 환급항목 */}
      {result.topItem && (
        <div className="card" style={{background:taxInfo.gradient,border:'none',color:'#fff'}}>
          <div style={{display:'flex',alignItems:'center',gap:16}}>
            <div style={{width:56,height:56,borderRadius:18,background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <i className="fas fa-trophy" style={{fontSize:24}}/>
            </div>
            <div>
              <p style={{fontSize:12,opacity:.7}}>최대 환급 항목</p>
              <p style={{fontSize:18,fontWeight:800}}>{result.topItem.name}</p>
              <p style={{fontSize:12,opacity:.7,marginTop:2}}>{result.topItem.법조문}</p>
            </div>
            <div style={{marginLeft:'auto',textAlign:'right'}}>
              <p style={{fontSize:28,fontWeight:800}}>{fmtW(result.topItem.refund)}원</p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DetailsTab({result,taxInfo}){
  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="card">
        <h3 style={{fontWeight:800,fontSize:16,marginBottom:4}}>적용 가능 공제 항목</h3>
        <p style={{fontSize:12,color:'var(--g4)',marginBottom:20}}>{result.details.length}개 항목 발견 · 총 {fmtW(result.totalRefund)}원</p>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {result.details.sort((a,b)=>b.refund-a.refund).map((d,i)=>(
            <div key={d.id} style={{padding:16,background:'var(--g0)',borderRadius:16,border:'1px solid var(--g2)'}}>
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <div style={{width:36,height:36,borderRadius:10,background:d.priority==='high'?'var(--ok1)':d.priority==='medium'?'var(--p1)':'var(--g1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontWeight:800,fontSize:14,color:d.priority==='high'?'var(--ok)':d.priority==='medium'?'var(--p)':'var(--g4)'}}>
                  {i+1}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    <p style={{fontWeight:700,fontSize:14}}>{d.name}</p>
                    <Badge color={d.priority==='high'?'var(--ok)':d.priority==='medium'?'var(--p)':'var(--g4)'} bg={d.priority==='high'?'var(--ok1)':d.priority==='medium'?'var(--p1)':'var(--g1)'}>
                      {d.priority==='high'?'높음':d.priority==='medium'?'보통':'낮음'}
                    </Badge>
                    <Badge>{d.category}</Badge>
                  </div>
                  <p style={{fontSize:11,color:'var(--g4)',marginTop:4}}>{d.desc}</p>
                  <p style={{fontSize:10,color:'var(--p)',marginTop:2}}>{d.법조문}</p>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <p style={{fontWeight:800,fontSize:18,color:'var(--ok)'}}>{fmtW(d.refund)}원</p>
                  <p style={{fontSize:10,color:'var(--g4)'}}>({Math.round(d.refund/result.totalRefund*100)}%)</p>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* 미적용 항목 */}
      {result.allDetails.filter(d=>!d.applicable).length > 0 && (
        <div className="card" style={{opacity:.7}}>
          <h3 style={{fontWeight:700,fontSize:14,marginBottom:12,color:'var(--g4)'}}>
            <i className="fas fa-times-circle" style={{marginRight:6}}/>미적용 항목 ({result.allDetails.filter(d=>!d.applicable).length}개)
          </h3>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {result.allDetails.filter(d=>!d.applicable).map(d=>(
              <Badge key={d.id} color="var(--g4)" bg="var(--g1)">{d.name}</Badge>
            ))}
          </div>
          <p style={{fontSize:11,color:'var(--g4)',marginTop:8}}>현재 입력 조건에서는 적용되지 않으나, 전문가 검토 시 추가 적용 가능성이 있습니다.</p>
        </div>
      )}
    </div>
  );
}

function TimelineTab({result,taxInfo,taxType}){
  const maxAmount = Math.max(...result.byYear.map(y=>y.amount));
  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="card">
        <h3 style={{fontWeight:800,fontSize:16,marginBottom:20}}><i className="fas fa-calendar-alt" style={{color:'var(--p)',marginRight:8}}/>연도별 환급 예상액</h3>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {result.byYear.map(y=>(
            <div key={y.year} style={{padding:16,background:'var(--g0)',borderRadius:16}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontWeight:800,fontSize:16}}>{y.year}년 귀속</span>
                  {y.daysLeft <= 180 ? (
                    <Badge color="var(--ng)" bg="var(--ng1)"><i className="fas fa-exclamation-triangle" style={{fontSize:8}}/>D-{y.daysLeft} 긴급!</Badge>
                  ) : y.daysLeft <= 365 ? (
                    <Badge color="var(--wn)" bg="var(--wn1)">D-{y.daysLeft}</Badge>
                  ) : (
                    <Badge color="var(--ok)" bg="var(--ok1)">D-{y.daysLeft}</Badge>
                  )}
                </div>
                <span style={{fontWeight:800,fontSize:18,color:taxInfo.color}}>{fmtW(y.amount)}원</span>
              </div>
              <ProgressBar pct={y.amount/maxAmount*100} color={taxInfo.color} height={6}/>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--g4)',marginTop:6}}>
                <span>신고기한: {y.year+1}년 {DEDUCTIONS[taxType].filingMonth}월</span>
                <span>경정청구 기한: {y.year+6}년 {DEDUCTIONS[taxType].filingMonth}월</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* 기한 안내 */}
      <div style={{background:'var(--wn1)',borderRadius:16,padding:20,border:'1px solid rgba(255,184,0,.2)'}}>
        <p style={{fontSize:13,fontWeight:700,color:'var(--wn)',marginBottom:8}}><i className="fas fa-clock" style={{marginRight:6}}/>경정청구 기한 안내</p>
        <p style={{fontSize:12,color:'var(--g5)',lineHeight:1.8}}>
          경정청구는 법정신고기한으로부터 <b>5년 이내</b>에 청구해야 합니다.<br/>
          기한이 임박한 연도가 있다면 조속한 진행을 권장합니다.<br/>
          기한 경과 후에는 환급이 불가능하므로 유의하세요.
        </p>
      </div>
    </div>
  );
}

function MoneyTab({result,taxInfo,formData}){
  const feeRate = 0.20;
  const fee = result.estimatedFee;
  const interest = result.estimatedInterest;
  const net = result.netRefund;

  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {/* Before vs After */}
      <div className="card">
        <h3 style={{fontWeight:800,fontSize:16,marginBottom:16}}><i className="fas fa-scale-balanced" style={{color:'var(--p)',marginRight:8}}/>Before vs After 비교</h3>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}} className="grid-2">
          <div style={{background:'var(--ng1)',borderRadius:16,padding:20,textAlign:'center'}}>
            <p style={{fontSize:12,fontWeight:700,color:'var(--ng)',marginBottom:4}}>기존 (경정청구 전)</p>
            <p style={{fontSize:11,color:'var(--g4)',marginBottom:10}}>납부한 세금 그대로</p>
            <p style={{fontSize:28,fontWeight:800,color:'var(--ng)'}}>{fmtW(formData.taxPaid * formData.years.length)}원</p>
            <p style={{fontSize:10,color:'var(--g4)',marginTop:4}}>총 {formData.years.length}년 납부 세액</p>
          </div>
          <div style={{background:'var(--ok1)',borderRadius:16,padding:20,textAlign:'center'}}>
            <p style={{fontSize:12,fontWeight:700,color:'var(--ok)',marginBottom:4}}>After (경정청구 후)</p>
            <p style={{fontSize:11,color:'var(--g4)',marginBottom:10}}>환급금 수령</p>
            <p style={{fontSize:28,fontWeight:800,color:'var(--ok)'}}>{fmtW(formData.taxPaid * formData.years.length - result.totalRefund)}원</p>
            <p style={{fontSize:10,color:'var(--g4)',marginTop:4}}>실질 세부담</p>
          </div>
        </div>
        <div style={{marginTop:12,background:'var(--ok1)',borderRadius:12,padding:'12px 16px',textAlign:'center'}}>
          <span style={{fontSize:14,fontWeight:800,color:'var(--ok)'}}>
            <i className="fas fa-arrow-down" style={{marginRight:6}}/>세부담 {fmtW(result.totalRefund)}원 절감
          </span>
        </div>
      </div>

      {/* 수익 분석 */}
      <div className="card">
        <h3 style={{fontWeight:800,fontSize:16,marginBottom:16}}><i className="fas fa-calculator" style={{color:'var(--violet)',marginRight:8}}/>수익 분석 (성과보수 기준)</h3>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',justifyContent:'space-between',padding:'12px 16px',background:'var(--g0)',borderRadius:12}}>
            <span style={{fontSize:13,fontWeight:600}}>예상 환급금 총액</span>
            <span style={{fontSize:15,fontWeight:800,color:'var(--ok)'}}>+{fmtW(result.totalRefund)}원</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',padding:'12px 16px',background:'var(--g0)',borderRadius:12}}>
            <span style={{fontSize:13,fontWeight:600}}>환급가산금 (이자)</span>
            <span style={{fontSize:15,fontWeight:800,color:'var(--p)'}}>+{fmtW(interest)}원</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',padding:'12px 16px',background:'var(--ng1)',borderRadius:12}}>
            <span style={{fontSize:13,fontWeight:600}}>성과보수 (환급금의 {Math.round(feeRate*100)}%)</span>
            <span style={{fontSize:15,fontWeight:800,color:'var(--ng)'}}>-{fmtW(fee)}원</span>
          </div>
          <div style={{height:1,background:'var(--g2)',margin:'4px 0'}}/>
          <div style={{display:'flex',justifyContent:'space-between',padding:'14px 16px',background:'var(--ok1)',borderRadius:12,border:'2px solid var(--ok)'}}>
            <span style={{fontSize:15,fontWeight:800}}>실수령 예상액</span>
            <span style={{fontSize:20,fontWeight:800,color:'var(--ok)'}}>{fmtW(net)}원</span>
          </div>
        </div>
        <div style={{marginTop:16,padding:12,background:'var(--p1)',borderRadius:10}}>
          <p style={{fontSize:11,color:'var(--p2)',lineHeight:1.7}}>
            <i className="fas fa-info-circle" style={{marginRight:4}}/>
            성과보수 비율은 환급 금액·난이도에 따라 협의됩니다. 위 계산은 {Math.round(feeRate*100)}% 기준입니다.<br/>
            환급가산금: 연 3.1% (국세기본법 시행규칙 §19의3), 평균 180일 기준 추정
          </p>
        </div>
      </div>

      {/* ROI */}
      <div className="card" style={{background:'linear-gradient(135deg,#0A1628,#162848)',border:'none',color:'#fff',textAlign:'center'}}>
        <p style={{fontSize:12,opacity:.7}}>투자수익률 (ROI)</p>
        <p style={{fontSize:48,fontWeight:800,marginTop:8}}>
          {fee > 0 ? Math.round((net / fee) * 100) : '∞'}%
        </p>
        <p style={{fontSize:13,opacity:.7,marginTop:8}}>
          수수료 {fmtW(fee)}원 대비 실수령 {fmtW(net)}원
        </p>
      </div>
    </div>
  );
}

function DocsTab({docs,taxInfo}){
  const [checked,setChecked]=useState({});
  const toggle = (i) => setChecked(p=>({...p,[i]:!p[i]}));
  const total = docs.length;
  const done = Object.values(checked).filter(Boolean).length;

  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="card">
        <h3 style={{fontWeight:800,fontSize:16,marginBottom:4}}><i className="fas fa-folder-open" style={{color:'var(--ac)',marginRight:8}}/>경정청구 필요 서류</h3>
        <p style={{fontSize:12,color:'var(--g4)',marginBottom:16}}>준비된 서류를 체크해주세요 ({done}/{total})</p>
        <ProgressBar pct={done/total*100} color="var(--ok)" height={6}/>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:16}}>
          {docs.map((d,i)=>(
            <div key={i} onClick={()=>toggle(i)} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:checked[i]?'var(--ok1)':'var(--g0)',borderRadius:12,cursor:'pointer',border:`1px solid ${checked[i]?'var(--ok)':'var(--g2)'}`,transition:'all .15s'}}>
              <div style={{width:24,height:24,borderRadius:8,border:`2px solid ${checked[i]?'var(--ok)':'var(--g3)'}`,background:checked[i]?'var(--ok)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .15s'}}>
                {checked[i]&&<i className="fas fa-check" style={{color:'#fff',fontSize:10}}/>}
              </div>
              <span style={{fontSize:13,fontWeight:600,color:checked[i]?'var(--ok)':'var(--dk)',textDecoration:checked[i]?'line-through':'none'}}>{d.name}</span>
              {d.required&&<Badge color="var(--ng)" bg="var(--ng1)">필수</Badge>}
            </div>
          ))}
        </div>
      </div>

      <div style={{background:'var(--p1)',borderRadius:16,padding:20,border:'1px solid rgba(2,103,255,.1)'}}>
        <p style={{fontSize:13,fontWeight:700,color:'var(--p2)',marginBottom:6}}><i className="fas fa-lightbulb" style={{marginRight:6}}/>서류 준비 TIP</p>
        <ul style={{fontSize:12,color:'var(--g5)',lineHeight:2,paddingLeft:16}}>
          <li>홈택스에서 대부분의 서류를 <b>온라인으로 발급</b>받을 수 있습니다.</li>
          <li>필수 서류는 반드시 준비해야 하며, 선택 서류는 환급 항목에 따라 다릅니다.</li>
          <li>세무사 상담 시 추가 서류가 요청될 수 있습니다.</li>
          <li>서류 준비에 어려움이 있으시면 <b>한백택스가 대행</b>해드립니다.</li>
        </ul>
      </div>
    </div>
  );
}

function FaqTab(){
  return(
    <div>
      <h3 style={{fontWeight:800,fontSize:16,marginBottom:16}}><i className="fas fa-circle-question" style={{color:'var(--p)',marginRight:8}}/>자주 묻는 질문</h3>
      <Accordion items={FAQ_DATA}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
