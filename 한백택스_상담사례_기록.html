<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon-192.png" type="image/png">
<title>한백택스 상담 사례 기록 — 판단 규칙 축적(직원용)</title>
<!--
  세무법인 한백택스 상담 사례 기록 v1 (2026-09-21) — 내부용
  목적: 「서비스 방향 검토안」 8장 — 오늘부터의 상담을 개인정보를 지운 뒤 일정한 형식으로 남겨 판단 규칙·실무노트의 원자료로 쌓는다.
        기록 항목: 고객 상황 / 첫 확인 사항(무엇을 왜 물었나) / 핵심 쟁점 / 검토한 선택지 / 놓치기 쉬운 부분 / 최종 처리(결론·이유·근거).
  원칙: 실명·주민번호·사업자번호·전화·상세 주소를 적지 않는다. 저장 전에 자동으로 걸러 경고한다(CLAUDE.md §6 예외: 위키·교육자료에는 식별정보를 옮기지 않는다).
  저장: 이 브라우저(localStorage hbt_cases_v1). JSON 내보내기·가져오기로 옮긴다. 서버로 보내지 않는다.
  상태: 초안 → 검수 완료(세무사 확인). 「검수 완료 + 공개 가능」만 「판단 규칙 내보내기」에 담긴다(진단 흐름·실무노트의 재료).
-->
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B3A5C;--gold:#C8963E;--blue:#2F5D8A;--bg:#F4F6F9;--line:#DCE3EC;--gray:#6B7A8C;--red:#B91C1C;--green:#166534}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#1f2937;font-family:"Nanum Gothic","맑은 고딕","Malgun Gothic",sans-serif;font-size:14px;line-height:1.6}
.top{background:#fff;border-bottom:2px solid var(--gold);padding:12px 20px}
.top h1{margin:0;font-size:19px;color:var(--navy)}
.top .sub{color:var(--gray);font-size:12.5px}
.wrap{display:grid;grid-template-columns:minmax(340px,560px) 1fr;gap:16px;padding:16px 20px 60px;max-width:1400px;margin:0 auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h2{font-size:14px;color:var(--navy);margin:0 0 8px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--gray);font-weight:700;margin-bottom:9px}
.fld input,.fld select,.fld textarea{font:inherit;font-size:13.5px;color:#111;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.fld textarea{min-height:74px;resize:vertical}
.fld .g{font-weight:400;color:var(--blue)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-weight:800;cursor:pointer;color:var(--navy);font-family:inherit;font-size:12.5px}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.n{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.warn{border:1px solid #fca5a5;background:#fef2f2;color:#7f1d1d;border-radius:8px;padding:8px 11px;font-size:12.5px;margin:8px 0;display:none}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat div{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fafbfd;text-align:center}
.stat b{display:block;font-size:20px;color:var(--navy)}
.stat span{font-size:11.5px;color:var(--gray)}
.it{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.it .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .h b{color:var(--navy);flex:1;min-width:160px}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:#EEF2F7;color:var(--navy)}
.tag.ok{background:#dcfce7;color:var(--green)}.tag.pub{background:#FEF3C7;color:#92400E}
.it .s{font-size:12.5px;color:#374151;margin-top:5px;white-space:pre-wrap}
.it .s i{color:var(--gray);font-style:normal;font-weight:800}
.hint{font-size:12px;color:var(--gray)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:10px}.row{grid-template-columns:1fr}.stat{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

   이 블록은 자동 생성이다. 직접 고치지 말고 생성기를 고쳐 다시 실행한다. */

<!-- /HB-HOME -->
<div class="top">
  <h1>상담 사례 기록 <span style="font-size:12px;font-weight:800;color:#92400E;background:#FEF3C7;border-radius:8px;padding:3px 8px;vertical-align:middle">직원용</span></h1>
  <div class="sub">정답보다 「질문 순서」를 남깁니다. 상담이 끝난 뒤 5분, 개인정보를 지우고 여섯 칸만 채우십시오. 매주 5건이면 1년에 약 250건의 판단 규칙이 쌓입니다. 이 브라우저에만 저장됩니다.</div>
</div>
<div class="wrap">
  <div class="panel">
    <h2 id="formTitle">새 사례</h2>
    <div class="row">
      <label class="fld">분야<select id="f_area"><option>부동산 증여·양도</option><option>상속·사전증여</option><option>법인·개인 자금 이동</option><option>비상장주식·가업승계</option><option>소득세·부가세</option><option>기타</option></select></label>
      <label class="fld">상담일<input type="date" id="f_date"></label>
      <label class="fld">상태<select id="f_state"><option value="draft">초안</option><option value="ok">검수 완료(세무사 확인)</option></select></label>
    </div>
    <label class="fld">한 줄 제목 <span class="g">예: 2주택자가 조정지역 아파트를 아들에게 증여 후 5년 내 매도 계획</span><input id="f_title"></label>
    <label class="fld">① 고객 상황 <span class="g">판단에 필요한 사실관계만. 이름·번호·주소는 적지 않습니다(예: 70대 남성, 서울 조정지역 아파트 시가 12억, 2012년 4억 취득).</span><textarea id="f_situation"></textarea></label>
    <label class="fld">② 첫 확인 사항 <span class="g">처음 무엇을 물었고, 왜 그것부터 물었는지</span><textarea id="f_first"></textarea></label>
    <label class="fld">③ 핵심 쟁점 <span class="g">어떤 법령·실무 문제가 걸리는지</span><textarea id="f_issue"></textarea></label>
    <label class="fld">④ 검토한 선택지 <span class="g">가능했던 대안과 비교 기준(세금·현금·위험)</span><textarea id="f_options"></textarea></label>
    <label class="fld">⑤ 놓치기 쉬운 부분 <span class="g">고객이나 초보 실무자가 자주 놓치는 점</span><textarea id="f_pitfall"></textarea></label>
    <label class="fld">⑥ 최종 처리 <span class="g">결론과 그 이유</span><textarea id="f_result"></textarea></label>
    <label class="fld">근거 법령·예규 <span class="g">예: 소득세법 §97의2, 상증법 §13 ① 1호</span><input id="f_law"></label>
    <label class="fld">자동 안내를 멈추고 세무사 검토로 넘겨야 하는 조건 <span class="g">진단 흐름의 「전문가 검토」 규칙이 됩니다</span><input id="f_stop"></label>
    <label style="display:flex;gap:7px;align-items:center;font-size:13px"><input type="checkbox" id="f_pub"> 익명화가 끝나 실무노트·진단 규칙에 써도 되는 사례</label>
    <div class="warn" id="piiWarn"></div>
    <div class="bar"><button type="button" class="btn p" onclick="saveCase()">저장</button><button type="button" class="btn" onclick="resetForm()">새로 쓰기</button></div>
  </div>
  <div class="panel">
    <div class="stat"><div><b id="s_week">0</b><span>이번 주 기록 (목표 5건)</span></div><div><b id="s_all">0</b><span>누적</span></div><div><b id="s_ok">0</b><span>검수 완료</span></div><div><b id="s_pub">0</b><span>공개 가능</span></div></div>
    <div class="bar">
      <input id="q" placeholder="검색 (제목·쟁점·법령)" style="flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit">
      <select id="qArea" style="padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit"><option value="">전체 분야</option></select>
    </div>
    <div class="bar">
      <button type="button" class="btn" onclick="exportAll()">💾 전체 내보내기(JSON)</button>
      <button type="button" class="btn" onclick="document.getElementById('imp').click()">📂 가져오기</button><input type="file" id="imp" accept=".json" style="display:none" onchange="importAll(this)">
      <button type="button" class="btn n" onclick="exportRules()">🧠 판단 규칙 내보내기</button>
    </div>
    <div class="hint" style="margin-bottom:8px">「판단 규칙 내보내기」는 검수 완료 + 공개 가능 사례만 담습니다. 진단 흐름의 질문·검토 조건과 실무노트의 재료로 씁니다.</div>
    <div id="list"></div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='hbt_cases_v1';
const F=['area','date','state','title','situation','first','issue','options','pitfall','result','law','stop'];
let DB=[];let editing=null;
try{DB=JSON.parse(localStorage.getItem(LS)||'[]');if(!Array.isArray(DB))DB=[];}catch(e){DB=[];}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){alert('저장 공간이 부족합니다. 내보내기 후 정리하십시오.');}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
/* 개인정보 자동 점검 — 걸리면 저장 전에 알린다 */
/* 날짜(2026-09-21)·금액(1200000000)은 걸리지 않게: 번호류는 붙임표가 있는 꼴만, 계좌는 끝 묶음 4자리 이상 */
const PII=[[/\b\d{6}-[1-8]\d{6}\b|\b\d{13}\b/,'주민등록번호'],[/\b\d{3}-\d{2}-\d{5}\b/,'사업자등록번호'],[/\b01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}\b/,'휴대폰 번호'],[/\b0\d{1,2}[-.]\d{3,4}[-.]\d{4}\b/,'전화번호'],[/[^\s@]+@[^\s@]+\.[a-z]{2,}/i,'이메일'],[/\d+동\s*\d+호/,'동·호수'],[/\b\d{3,6}-\d{2,6}-\d{4,8}\b/,'계좌번호로 보이는 숫자']];
const PII_FIELDS=['title','situation','first','issue','options','pitfall','result','law','stop'];   /* 상담일·분야·상태는 검사하지 않는다 */
function piiFind(){const t=PII_FIELDS.map(k=>$('f_'+k).value).join('\n');return PII.filter(([re])=>re.test(t)).map(([,n])=>n);}
function readForm(){const o={};F.forEach(k=>o[k]=$('f_'+k).value.trim());o.pub=$('f_pub').checked;return o;}
function fillForm(o){F.forEach(k=>$('f_'+k).value=o[k]||'');$('f_pub').checked=!!o.pub;}
function resetForm(){editing=null;fillForm({area:'부동산 증여·양도',date:today(),state:'draft'});$('formTitle').textContent='새 사례';$('piiWarn').style.display='none';}
function saveCase(){
  const o=readForm();
  if(!o.title||!o.situation){alert('제목과 ① 고객 상황은 꼭 적어 주십시오.');return;}
  const hit=piiFind(),w=$('piiWarn');
  if(hit.length){w.style.display='block';w.innerHTML='<b>개인정보로 보이는 내용이 있습니다: '+hit.join(', ')+'</b><br>지운 뒤 다시 저장하십시오. 사례에는 판단에 필요한 사실관계만 남깁니다.';return;}
  w.style.display='none';
  if(o.pub&&o.state!=='ok'&&!confirm('검수 완료 전인데 「공개 가능」으로 표시했습니다. 그대로 저장할까요?'))return;
  if(editing){const i=DB.findIndex(x=>x.id===editing);if(i>=0)DB[i]=Object.assign({},DB[i],o,{updated:today()});}
  else DB.unshift(Object.assign({id:'C'+Date.now(),created:today()},o));
  persist();resetForm();render();
}
function editCase(id){const o=DB.find(x=>x.id===id);if(!o)return;editing=id;fillForm(o);$('formTitle').textContent='사례 고치기';window.scrollTo({top:0,behavior:'smooth'});}
function delCase(id){const o=DB.find(x=>x.id===id);if(!o||!confirm('「'+o.title+'」 사례를 지웁니다.'))return;DB=DB.filter(x=>x.id!==id);persist();render();}
function weekStart(){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);d.setHours(0,0,0,0);return d;}
function render(){
  const ws=weekStart();
  $('s_week').textContent=DB.filter(x=>new Date((x.created||x.date)+'T00:00:00')>=ws).length;
  $('s_all').textContent=DB.length;$('s_ok').textContent=DB.filter(x=>x.state==='ok').length;$('s_pub').textContent=DB.filter(x=>x.pub&&x.state==='ok').length;
  const areas=[...new Set(DB.map(x=>x.area).filter(Boolean))];const sel=$('qArea'),cur=sel.value;
  sel.innerHTML='<option value="">전체 분야</option>'+areas.map(a=>'<option>'+esc(a)+'</option>').join('');sel.value=cur;
  const q=$('q').value.trim().toLowerCase();
  const L=DB.filter(x=>(!sel.value||x.area===sel.value)&&(!q||F.some(k=>String(x[k]||'').toLowerCase().indexOf(q)>=0)));
  $('list').innerHTML=L.length?L.map(x=>'<div class="it"><div class="h"><b>'+esc(x.title)+'</b><span class="tag">'+esc(x.area)+'</span><span class="tag'+(x.state==='ok'?' ok':'')+'">'+(x.state==='ok'?'검수 완료':'초안')+'</span>'+(x.pub?'<span class="tag pub">공개 가능</span>':'')+'<span class="hint">'+esc(x.date||'')+'</span><button type="button" class="btn" onclick="editCase(\''+x.id+'\')">고치기</button><button type="button" class="btn" onclick="delCase(\''+x.id+'\')">삭제</button></div>'+
    '<div class="s"><i>첫 확인</i> '+esc(x.first||'—')+'\n<i>쟁점</i> '+esc(x.issue||'—')+'\n<i>놓치기 쉬운 점</i> '+esc(x.pitfall||'—')+(x.law?'\n<i>근거</i> '+esc(x.law):'')+'</div></div>').join(''):'<div class="hint">아직 기록이 없습니다. 오늘 상담 한 건부터 남겨 보십시오.</div>';
}
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportAll(){dl('상담사례_전체_'+today()+'.json',{app:'hbt-cases',ver:1,exported:today(),cases:DB});}
function exportRules(){
  const ok=DB.filter(x=>x.pub&&x.state==='ok');
  if(!ok.length){alert('검수 완료 + 공개 가능 사례가 아직 없습니다.');return;}
  dl('판단규칙_'+today()+'.json',{app:'hbt-rules',ver:1,exported:today(),rules:ok.map(x=>({id:x.id,area:x.area,title:x.title,situation:x.situation,firstQuestions:x.first,issue:x.issue,options:x.options,pitfall:x.pitfall,conclusion:x.result,law:x.law,expertReviewWhen:x.stop,verified:x.updated||x.created}))});
}
function importAll(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const arr=Array.isArray(o)?o:(o.cases||[]);let n=0;arr.forEach(c=>{if(c&&c.id&&!DB.some(x=>x.id===c.id)){DB.push(c);n++;}});DB.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));persist();render();alert(n+'건을 가져왔습니다(이미 있는 사례는 건너뜀).');}catch(e){alert('읽을 수 없는 파일입니다.');}inp.value='';};r.readAsText(f);}
$('q').addEventListener('input',render);$('qArea').addEventListener('change',render);
resetForm();render();
</script>
