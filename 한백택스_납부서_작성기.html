<!--
  세무법인 한백택스 납부서 작성기 v1 (2026-10-02) — 사무실 내부용(직원 → 거래처 전달)
  - 하는 일: 거래처·세목·세액·기준일 → 납부기한(토·일·공휴일 이월)·분납·지방소득세 → A4 납부 안내서(인쇄·PDF) + 홈택스 자진납부 입력값 + 카톡 문구
  - 금융기관 수납용 납부서(OCR)가 아니다. 실제 납부는 홈택스에서 자진납부로 받은 전자납부번호로 한다. 안내서에 그 점을 적는다.
  - 거래처: 업무판(localStorage hanbaek_board_v1)의 명부를 불러온다. 공휴일도 업무판 설정을 쓰고, 없으면 아래 기본 목록.
  - 앱 파일에는 거래처 데이터가 없다. 작성 중인 내용은 이 브라우저(localStorage hanbaek_payslip_v1)에만 남는다.
  - 기한·분납 근거는 RULES 주석에 조문으로 적었다(K-Law MCP 확인일 기재).
-->
<style>
:root{--navy:#1B3A5C;--blue:#2E6DA4;--gold:#C8963E;--bg:#F5F8FC;--line:#DCE5F0;--t1:#0F2440;--t2:#35507A;--gray:#6E7F94;--red:#C0392B;--redbg:#FDECEA;--green:#1E7D4E;--greenbg:#E6F4EC;--gsoft:#FBF3E4;--amber:#8a6100}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Nanum Gothic","맑은 고딕","Malgun Gothic",sans-serif}
body{background:var(--bg);color:var(--t1);font-size:14px;line-height:1.55}
.top{background:#fff;border-bottom:2px solid var(--gold);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:42px;z-index:20}

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const num=v=>{const n=parseInt(String(v||'').replace(/[^0-9-]/g,''),10);return isNaN(n)?0:n;};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const WD='일월화수목금토';
const ymK=ym=>{const [y,m]=String(ym||'').split('-');return y+'년 '+(+m)+'월';};
const kdate=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.('+WD[d.getDay()]+')';};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800);}
function copyText(s){(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('복사했습니다')).catch(()=>{const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했습니다');}catch(e){}ta.remove();});}

/* ---------- 업무판 연동 · 공휴일 ---------- */
const BOARD_LS='hanbaek_board_v1', LS='hanbaek_payslip_v1';
/* 업무판 기본 공휴일과 같은 목록(업무판 설정이 있으면 그것을 쓴다) */
const DEFAULT_HOL=['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-02','2026-05-05','2026-05-25','2026-06-06','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-05','2026-10-09','2026-12-25','2027-01-01','2027-02-08','2027-02-09','2027-02-10','2027-03-01','2027-05-05','2027-05-13','2027-06-06','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-04','2027-10-11','2027-12-27'];
let BOARD=null;try{BOARD=JSON.parse(localStorage.getItem(BOARD_LS)||'null');}catch(e){}
const HOL=new Set((BOARD&&BOARD.settings&&BOARD.settings.hol&&BOARD.settings.hol.length)?BOARD.settings.hol:DEFAULT_HOL);
/* 국세기본법 §5 ①: 기한이 토·일, 공휴일·대체공휴일(제2호), 노동절(제3호, 5월 1일)이면 그 다음 날 — MCP 확인 2026-10-02 */
function nextBiz(s){let d=new Date(s+'T00:00:00');for(let i=0;i<15;i++){const w=d.getDay(),k=iso(d),may1=(d.getMonth()===4&&d.getDate()===1);if(w!==0&&w!==6&&!HOL.has(k)&&!may1)break;d.setDate(d.getDate()+1);}return iso(d);}
const lastDay=(y,m)=>new Date(y,m,0).getDate();           /* m: 1~12 */
const ymd=(y,m,d)=>{while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad(m)+'-'+pad(Math.min(d,lastDay(y,m)));};
const monthEnd=(y,m)=>ymd(y,m,31);                          /* 그 달 말일 (m 이 12 를 넘으면 다음 해) */
/* 기한 + n개월: 말일 기한이면 말일로, 아니면 같은 날 */
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);return d===lastDay(y,m)?monthEnd(y,m+n):ymd(y,m+n,d);}

/* ---------- 세목 정의 ---------- */
/* 기한 근거 — 모두 K-Law MCP 원문 확인 2026-10-02 (부칙·시행예정 개정은 미확인)
   원천세      소득세법 §128 ① 다음 달 10일, ② 반기의 마지막 달의 다음 달 10일 / 지방소득세 특별징수 지방세법 §103의13 ② (반기 단서 포함)
   부가가치세  부가가치세법 §48 ① 예정 25일, §49 ① 확정 25일
   종합소득세  소득세법 §70 ① 5월 31일, §70의2 ② 성실신고확인 6월 30일, §65 중간예납 11월 30일
   법인세      법인세법 §60 ① 사업연도 종료일이 속하는 달의 말일부터 3개월(성실신고확인서 제출 시 4개월, 같은 항 괄호), §63 ③ 중간예납기간(개시 6개월) 지난 날부터 2개월, §63 ④ 중간예납 분납

      '<label class="fld">사업주 구분 (기본세율)'+sel('fRb',[['50000','개인 — 5만원'],['50000','법인 자본금 30억원 이하 — 5만원'],['100000','법인 30억원 초과 50억원 이하 — 10만원'],['200000','법인 50억원 초과 — 20만원'],['50000','그 밖의 법인 — 5만원']],'50000')+'</label>'+
      '<label class="fld">연면적분 세액 (원)<input class="num" id="fArea" placeholder="해당 없으면 비움"></label>'+AMT+PLACE+DUE_INPUT+'</div>'+
      '<div class="note">8월 1일~31일 신고·납부(지방세법 §83 ③). 기본세율 + 연면적분(㎡당 250원, 오염물질 배출 사업소 500원)으로 채웁니다. 조례로 ±50% 가감할 수 있고 연면적 과세 기준은 따로 확인하십시오 — 세액 칸은 고쳐 넣을 수 있습니다.</div>';
    case 'resEmp':return '<div class="g2"><label class="fld">급여 지급월<input id="fYM" type="month" value="'+prevYM+'"></label>'+T(['정기','수정','기한후'],'정기')+
      '<label class="fld">급여총액 (원)<input class="num" id="fPay"></label>'+AMT+PLACE+DUE_INPUT+'</div>'+
      '<div class="note">급여총액의 0.5%(지방세법 §84의3 ①, 조례 ±50%)로 채웁니다. 최근 12개월 월평균 급여총액이 1억8천만원 이하이면 과세하지 않습니다(§84의4 ①, 영 §85의2). 다음 달 10일까지 냅니다(§84의6 ②).</div>';
    case 'acq':return '<div class="g2"><label class="fld">취득 원인'+sel('fCause',[['buy','유상취득(매매 등) — 취득일부터 60일'],['gift','무상취득(증여)·부담부증여 — 달 말일부터 3개월'],['inh','상속 — 달 말일부터 6개월']],'buy')+'</label>'+
      '<label class="fld">취득일 (상속은 상속개시일)<input id="fD" type="date"></label>'+T(['정기','기한후'],'정기')+PLACE+
      '<label class="fld">취득세 (원)<input class="num" id="fAmt"></label><label class="fld">지방교육세 (원)<input class="num" id="fEdu"></label><label class="fld">농어촌특별세 (원)<input class="num" id="fAgri"></label>'+DUE_INPUT+'</div>'+
      '<label class="chk mt8"><input type="checkbox" id="fNR"> 상속인이 외국에 주소를 둔 경우 (9개월)</label>'+
      '<div class="note">기한 안에 등기·등록을 하려면 접수일까지 신고·납부해야 합니다(지방세법 §20 ④). 토지거래허가 전 대금을 다 낸 경우 기산일은 허가일입니다. 농어촌특별세는 국세지만 취득세와 함께 신고·납부합니다(농어촌특별세법 §7 ①).</div>';
  }
  return '';
}
function locWire(){
  const ft=$('fType');if(ft)ft.onchange=()=>{$('fDueWrap').style.display=/수정|기한후/.test(ft.value)?'':'none';};
  const rb=$('fRb'),ar=$('fArea'),pay=$('fPay');
  if(rb){const f=()=>{$('fAmt').value=won(num(rb.value)+num(ar.value));};rb.onchange=f;ar.oninput=f;f();}
  if(pay)pay.oninput=()=>{const p=num(pay.value);$('fAmt').value=p?won(Math.floor(p*0.005)):'';};
}
function whtLocal(k){const v=num($('w_'+k).value);$('l_'+k).value=v?won(Math.floor(v*0.1/10)*10):'';}

/* ---------- 기한 계산 ---------- */
function dueOf(it){
  if(/수정|기한후/.test(it.type))return {due:it.due,legal:''};
  let s='',why='';
  switch(it.kind){
    case 'wht':
      if(it.cycle==='h'){const [y,h]=it.half.split('-').map(Number);s=h===1?y+'-07-10':(y+1)+'-01-10';why='소득세법 §128 ② (반기납부)';}
      else{const [y,m]=it.ym.split('-').map(Number);s=ymd(y,m+1,10);why='소득세법 §128 ①';}
      break;
    case 'vat':{const [y,p]=it.vat.split('-');const Y=+y;s={'1p':Y+'-04-25','1':Y+'-07-25','2p':Y+'-10-25','2':(Y+1)+'-01-25'}[p];why=p.endsWith('p')?'부가가치세법 §48 ①':'부가가치세법 §49 ①';break;}
    case 'inc':s=(it.y+1)+(it.type==='성실신고확인'?'-06-30':'-05-31');why=it.type==='성실신고확인'?'소득세법 §70의2 ②':'소득세법 §70 ①';break;
    case 'corp':{const [y,m]=it.ym.split('-').map(Number);
      if(it.type==='중간예납'){s=monthEnd(y,m-4);why='법인세법 §63 ③';}      /* 1년 사업연도 기준: 개시 후 6개월(종료월-6) 지난 날부터 2개월 → 종료월-4 의 말일 */
      else{s=monthEnd(y,m+(it.type==='성실신고확인'?4:3));why='법인세법 §60 ①';}
      break;}
    case 'trf':({s,why}=trfLegal(it));break;
    case 'gift':{const [y,m]=it.d.split('-').map(Number);s=monthEnd(y,m+3);why='상증법 §68 ①';break;}
    case 'inh':{const [y,m]=it.d.split('-').map(Number);s=monthEnd(y,m+(it.nr?9:6));why=it.nr?'상증법 §67 ④':'상증법 §67 ①';break;}
    case 'si':{const [y,m]=it.ym.split('-').map(Number);s=ymd(y,m+1,10);why='국민건강보험법 §78 ① 등';break;}
    case 'loc':({s,why}=locLegal(it));break;
  }
  return {due:nextBiz(s),legal:s,why};
}
function trfLegal(it){const [y,m]=it.d.split('-').map(Number);
  if(it.type==='확정')return {s:(y+1)+'-05-31',why:'소득세법 §110 ①'};
  if(it.stock)return {s:monthEnd(y,(m<=6?6:12)+2),why:'소득세법 §105 ① 2호'};
  return {s:monthEnd(y,m+(it.burden?3:2)),why:it.burden?'소득세법 §105 ① 3호':'소득세법 §105 ① 1호'};}
function locLegal(it){
  switch(it.lk){
    case 'corpLoc':{const [y,m]=it.ym.split('-').map(Number);return {s:monthEnd(y,m+(it.honest?5:4)),why:'지방세법 §103의23 ①'};}
    case 'incLoc':return {s:(it.y+1)+(it.type==='성실신고확인'?'-06-30':'-05-31'),why:'지방세법 §95 ①'};
    case 'trfLoc':{const t=trfLegal(it);return {s:addMonths(t.s,2),why:it.type==='확정'?'지방세법 §103의7 ①':'지방세법 §103의5 ①'};}
    case 'resBiz':return {s:it.y+'-08-31',why:'지방세법 §83 ③'};
    case 'resEmp':{const [y,m]=it.ym.split('-').map(Number);return {s:ymd(y,m+1,10),why:'지방세법 §84의6 ②'};}
    case 'acq':{const [y,m,d]=it.d.split('-').map(Number);
      if(it.cause==='buy'){const t=new Date(y,m-1,d+60);return {s:iso(t),why:'지방세법 §20 ①'};}
      return {s:monthEnd(y,m+(it.cause==='gift'?3:(it.nr?9:6))),why:'지방세법 §20 ①'};}
  }
  return {s:'',why:''};
}
/* 분납: 1천만원 초과 — 2천만원 이하면 1천만원 초과분, 2천만원 초과면 50% 이하 */
function splitAmt(a){if(a<=10000000)return 0;return a<=20000000?a-10000000:Math.floor(a/2);}
function ttlOf(it){
  const K=KINDS[it.kind].t;
  switch(it.kind){
    case 'wht':return it.cycle==='h'?it.half.replace(/-1$/,'년 상반기').replace(/-2$/,'년 하반기')+' 지급분':ymK(it.ym)+' 지급분';
    case 'vat':{const [y,p]=it.vat.split('-');return y+'년 '+{'1p':'1기 예정','1':'1기 확정','2p':'2기 예정','2':'2기 확정'}[p];}
    case 'inc':return it.y+'년 귀속';
    case 'corp':return ymK(it.ym)+' 종료 사업연도';
    case 'trf':return '양도일 '+it.d;
    case 'gift':return '증여일 '+it.d;
    case 'inh':return '상속개시일 '+it.d;
    case 'si':return ymK(it.ym)+'분';
    case 'loc':switch(it.lk){
      case 'corpLoc':return ymK(it.ym)+' 종료 사업연도';
      case 'incLoc':return it.y+'년 귀속';
      case 'trfLoc':return '양도일 '+(it.d||'');
      case 'resBiz':return it.y+'년 (7. 1. 기준)';
      case 'resEmp':return ymK(it.ym)+' 급여분';
      case 'acq':return '취득일 '+(it.d||'');}
  }
  return K;
}
/* 항목 → 안내서 줄 */
function linesOf(it){
  const {due,legal,why}=dueOf(it), L=[], K=KINDS[it.kind].t, per=ttlOf(it), tp=it.type||'';
  const where={nat:'홈택스',loc:'위택스',si:'공단 고지'};
  if(it.kind==='wht'){
    const nat=it.rows.reduce((s,r)=>s+r.a,0), loc=it.rows.reduce((s,r)=>s+r.l,0);
    const det=it.rows.filter(r=>r.a).map(r=>r.t).join('·');
    if(nat)L.push({tax:'원천세 (소득세)',per,tp,det,amt:nat,due,legal,why,ch:where.nat});
    if(loc)L.push({tax:'지방소득세 (특별징수)',per,tp,det,amt:loc,due,legal,why:'지방세법 §103의13 ②',ch:where.loc});
    return L;
  }
  if(it.kind==='loc'){
    const nm=LK[it.lk].t, pl=it.place?('납세지 '+it.place):'';
    if(it.lk==='acq'){
      [[nm,it.amt],['지방교육세',it.edu],['농어촌특별세',it.agri]].forEach(([t,a],i)=>{if(a)L.push({tax:t,per,tp,det:i===2?'취득세와 함께 신고·납부(국세)':(i===1?'취득세와 함께':pl),amt:a,due,legal,why:i===2?'농어촌특별세법 §7 ①':why,ch:where.loc,lk:it.lk});});
      return L;
    }
    const sp=it.split?splitLocal(it.amt):0;
    if(sp){
      const n=it.lk==='corpLoc'?(it.sme?2:1):2, due2=nextBiz(addMonths(legal||due,n));
      L.push({tax:nm,per,tp,det:'1차(기한 내)'+(pl?' · '+pl:''),amt:it.amt-sp,due,legal,why,ch:where.loc,lk:it.lk});
      L.push({tax:nm,per,tp,det:'2차(분납 '+n+'개월)',amt:sp,due:due2,legal:'',why:'분납',ch:where.loc,lk:it.lk});
    }else L.push({tax:nm,per,tp,det:pl,amt:it.amt,due,legal,why,ch:where.loc,lk:it.lk});
    return L;
  }
  if(it.kind==='si'){
    [['np','국민연금'],['hi','건강보험'],['lt','장기요양보험'],['ei','고용보험'],['ia','산재보험']].forEach(([k,t])=>{if(it.s[k])L.push({tax:t,per,tp:'고지',det:'',amt:it.s[k],due,legal,why,ch:where.si});});
    return L;
  }
  const a=it.amt, sp=it.split?splitAmt(a):0;
  if(sp){
    const n=it.kind==='corp'?(it.sme?2:1):SPLIT_MONTHS[it.kind];
    const base=legal||due, due2=nextBiz(addMonths(base,n));
    L.push({tax:K,per,tp,det:'1차(기한 내)',amt:a-sp,due,legal,why,ch:where.nat});
    L.push({tax:K,per,tp,det:'2차(분납 '+n+'개월)',amt:sp,due:due2,legal:'',why:'분납',ch:where.nat});
  }else L.push({tax:K,per,tp,det:'',amt:a,due,legal,why,ch:where.nat});
  if(it.local&&(it.kind==='inc'||it.kind==='trf')){
    const la=Math.floor(a*0.1/10)*10, late=/수정|기한후/.test(tp);
    if(it.kind==='trf'){
      /* 양도소득분: 국세 신고기한 + 2개월 (지방세법 §103의5 ①·§103의7 ①), 수정·기한후는 입력한 날 */
      const lg=late?'':addMonths(legal,2);
      L.push({tax:'개인지방소득세 (양도소득분)',per,tp,det:'소득세의 10% (신고서 금액 확인)',amt:la,due:late?due:nextBiz(lg),legal:lg,why:tp==='확정'?'지방세법 §103의7 ①':'지방세법 §103의5 ①',ch:where.loc,lk:'trfLoc'});
    }else{
      const ls=it.localSplit?splitLocal(la):0;
      if(ls){L.push({tax:'개인지방소득세 (종합소득분)',per,tp,det:'1차 · 소득세의 10% (신고서 금액 확인)',amt:la-ls,due,legal,why:'지방세법 §95 ①',ch:where.loc,lk:'incLoc'});
        L.push({tax:'개인지방소득세 (종합소득분)',per,tp,det:'2차(분납 2개월)',amt:ls,due:nextBiz(addMonths(legal||due,2)),legal:'',why:'지방세법 §95 ④',ch:where.loc,lk:'incLoc'});}
      else L.push({tax:'개인지방소득세 (종합소득분)',per,tp,det:'소득세의 10% (신고서 금액 확인)',amt:la,due,legal,why:'지방세법 §95 ①',ch:where.loc,lk:'incLoc'});
    }
  }
  return L;
}

/* ---------- 항목 추가 · 목록 ---------- */
let ITEMS=[];
function v(id){const e=$(id);return e?e.value:'';}
function c(id){const e=$(id);return !!(e&&e.checked);}
function addItem(){
  const it={id:Date.now()+''+Math.random().toString(36).slice(2,6),kind,type:v('fType')||'정기'};
  const msg=m=>{$('formMsg').textContent=m;return false;};
  if(/수정|기한후/.test(it.type)){it.due=v('fDue');if(!it.due)return msg('수정·기한후는 납부할 날을 넣으십시오');}
  if(kind==='wht'){
    it.cycle=v('fCycle');it.ym=v('fYM');it.half=v('fHalf');
    if(it.cycle==='m'&&!it.ym)return msg('지급연월을 넣으십시오');
    it.rows=WHT_ROWS.map(([k,t])=>({t,a:num(v('w_'+k)),l:num(v('l_'+k))})).filter(r=>r.a||r.l);
    if(!it.rows.length)return msg('세액을 한 줄 이상 넣으십시오');
  }else if(kind==='loc'){
    it.lk=lk;it.place=v('fPlace').trim();it.amt=num(v('fAmt'));
    if(lk==='acq'){it.cause=v('fCause');it.d=v('fD');it.nr=c('fNR');it.edu=num(v('fEdu'));it.agri=num(v('fAgri'));
      if(!it.d)return msg('취득일을 넣으십시오');if(!(it.amt||it.edu||it.agri))return msg('세액을 넣으십시오');
      if(it.nr&&it.cause!=='inh')return msg('외국 주소 9개월은 상속에만 씁니다');}
    else{
      if(!it.amt)return msg('세액을 넣으십시오');
      if(lk==='corpLoc'){it.ym=v('fYM');it.honest=c('fHonest');it.sme=c('fSme');if(!it.ym)return msg('사업연도 종료월을 넣으십시오');}
      if(lk==='incLoc'||lk==='resBiz')it.y=+v('fY');
      if(lk==='trfLoc'){it.d=v('fD');it.burden=c('fBurden');it.stock=c('fStock');if(!it.d)return msg('양도일을 넣으십시오');if(it.burden&&it.stock)return msg('부담부증여와 주식 중 하나만 고르십시오');}
      if(lk==='resEmp'){it.ym=v('fYM');if(!it.ym)return msg('급여 지급월을 넣으십시오');}
      it.split=c('fSplit');
      if(it.split&&it.amt<=1000000)return msg('지방소득세 분납은 세액 100만원 초과일 때만 됩니다');
      if(it.split&&/수정|기한후/.test(it.type))return msg('수정·기한후 분납은 이 도구에서 나누지 않습니다');
    }
  }else if(kind==='si'){
    it.ym=v('fYM');it.s={};['np','hi','lt','ei','ia'].forEach(k=>it.s[k]=num(v('s_'+k)));
    if(!Object.values(it.s).some(x=>x))return msg('보험료를 넣으십시오');
  }else{
    it.amt=num(v('fAmt'));if(!it.amt)return msg('세액을 넣으십시오');
    if(kind==='vat')it.vat=v('fVat');
    if(kind==='inc')it.y=+v('fY');
    if(kind==='corp'){it.ym=v('fYM');it.sme=c('fSme');if(!it.ym)return msg('사업연도 종료월을 넣으십시오');}
    if(kind==='trf'||kind==='gift'||kind==='inh'){it.d=v('fD');if(!it.d&&!it.due)return msg('기준일을 넣으십시오');}
    if(kind==='trf'){it.burden=c('fBurden');it.stock=c('fStock');if(it.burden&&it.stock)return msg('부담부증여와 주식 중 하나만 고르십시오');}
    if(kind==='inh')it.nr=c('fNR');
    it.local=c('fLocal');it.split=c('fSplit');it.localSplit=c('fLocalSplit');
    if(it.split&&it.amt<=10000000)return msg('분납은 세액 1천만원 초과일 때만 됩니다');
    if(/수정|기한후/.test(it.type)&&it.split)return msg('수정·기한후 분납은 이 도구에서 나누지 않습니다');
  }
  ITEMS.push(it);saveDraft();renderForm();render();toast(kname(it)+' 항목을 넣었습니다');
}
function delItem(id){ITEMS=ITEMS.filter(x=>x.id!==id);saveDraft();render();}
function clearItems(){if(ITEMS.length&&!confirm('납부 목록을 모두 지울까요?'))return;ITEMS=[];saveDraft();render();}

/* ---------- 납세자 ---------- */
function bizValid(no){const d=String(no||'').replace(/[^0-9]/g,'');if(d.length!==10)return false;const w=[1,3,7,1,3,7,1,3,5];let s=0;for(let i=0;i<9;i++)s+=parseInt(d[i])*w[i];s+=Math.floor(parseInt(d[8])*5/10);return (10-(s%10))%10===parseInt(d[9]);}
function fmtId(s){const d=String(s||'').replace(/[^0-9]/g,'');if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5);if(d.length===13)return d.slice(0,6)+'-'+d.slice(6);return s||'';}
function chkId(){const d=v('tId').replace(/[^0-9]/g,''),m=$('idMsg');let e='';
  if(d.length===10&&!bizValid(d))e='사업자등록번호 검증번호가 맞지 않습니다. 번호를 다시 확인하십시오.';
  else if(d&&d.length!==10&&d.length!==13)e='사업자등록번호는 10자리, 주민등록번호는 13자리입니다(지금 '+d.length+'자리).';
  m.style.display=e?'':'none';m.textContent=e;$('tId').classList.toggle('bad',!!e);}
function fillClients(){const L=(BOARD&&BOARD.clients)||[];const s=$('cliPick');
  if(!L.length){s.innerHTML='<option value="">업무판 거래처 없음</option>';s.disabled=true;return;}
  s.innerHTML='<option value="">업무판 거래처 불러오기 ('+L.length+')</option>'+L.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name||'(이름 없음)')+' '+esc(c.biz||'')+'</option>').join('');}
function pickClient(){const c=((BOARD&&BOARD.clients)||[]).find(x=>x.id===v('cliPick'));if(!c)return;
  $('tName').value=c.name||'';$('tCeo').value=c.ceo||'';$('tId').value=c.biz||'';$('tTel').value=c.tel||'';if(c.staff)$('tStaff').value=c.staff;
  chkId();saveDraft();render();}

/* ---------- 안내서 · 홈택스 · 카톡 ---------- */
function allLines(){return ITEMS.flatMap(it=>linesOf(it).map(l=>Object.assign(l,{iid:it.id,kind:it.kind})));}
function render(){
  const L=allLines();
  /* 목록 */
  $('itemList').innerHTML=ITEMS.length?'<table class="items"><tr><th>세목</th><th>귀속 · 구분</th><th>금액(원)</th><th>납부기한</th><th></th></tr>'+
    ITEMS.map(it=>{const ls=linesOf(it);return '<tr><td>'+esc(kname(it))+'</td><td>'+esc(ttlOf(it))+' · '+esc(it.type)+'</td><td class="r">'+won(ls.reduce((s,l)=>s+l.amt,0))+'</td><td class="c">'+ls.map(l=>esc(l.due)).filter((x,i,a)=>a.indexOf(x)===i).join('<br>')+'</td><td class="c"><button class="btn sm d" onclick="delItem(\''+it.id+'\')">삭제</button></td></tr>';}).join('')+'</table>':'<div class="empty">아직 넣은 항목이 없습니다</div>';
  /* 안내서 */
  const name=v('tName')||'(납세자)', idv=fmtId(v('tId')), dt=v('tDate')||today;
  const tot=L.reduce((s,l)=>s+l.amt,0);
  const chs=[...new Set(L.map(l=>l.ch))];
  const shifted=L.filter(l=>l.legal&&l.legal!==l.due);
  $('doc').innerHTML=
    '<div class="hd"><span class="co">세무법인 한백택스</span><span class="dt">안내일 '+kdate(dt)+'</span></div>'+
    '<h1>세금 납부 안내서</h1>'+
    '<div class="stamp">※ 납부 금액·기한 안내용입니다. 금융기관 수납용 납부서가 아닙니다.</div>'+
    '<table class="who"><tr><th>상호 · 성명</th><td>'+esc(name)+'</td><th>대표자</th><td>'+esc(v('tCeo'))+'</td></tr>'+
    '<tr><th>사업자 · 주민번호</th><td>'+esc(idv)+'</td><th>연락처</th><td>'+esc(v('tTel'))+'</td></tr></table>'+
    '<h2>납부하실 세금</h2>'+
    (L.length?'<table><tr><th>세목</th><th>귀속 · 구분</th><th>납부금액 (원)</th><th>납부기한</th><th>납부처</th></tr>'+
      L.map(l=>'<tr><td>'+esc(l.tax)+(l.det?'<br><span style="font-size:10.5pt;color:#555">'+esc(l.det)+'</span>':'')+'</td><td>'+esc(l.per)+'<br><span style="font-size:10.5pt;color:#555">'+esc(l.tp)+'</span></td><td class="r">'+won(l.amt)+'</td><td class="c nw">'+kdate(l.due)+'</td><td class="c nw">'+esc(l.ch)+'</td></tr>').join('')+
      '<tr class="tot"><td colspan="2" class="c">합 계</td><td class="r">'+won(tot)+'</td><td colspan="2"></td></tr></table>'
     :'<p class="empty">왼쪽에서 납부 항목을 넣으십시오.</p>')+
    (shifted.length?'<p style="font-size:10.5pt;color:#555;margin-top:4px">기한이 토·일·공휴일이면 다음 영업일로 옮겨 적었습니다(국세기본법 제5조'+(L.some(l=>l.ch==='위택스')?' · 지방세기본법 제24조':'')+').</p>':'')+
    '<h2>납부 방법</h2><ul>'+
    (chs.includes('홈택스')?'<li><b>국세(홈택스)</b> — 홈택스·손택스의 「납부·고지·환급 → 납부」에서 납부합니다. 저희가 보내 드리는 <b>납부서(납부번호)</b>로 계좌이체(본인 명의)·신용카드·인터넷뱅킹·은행 창구 납부가 됩니다. 카드 수수료는 신용카드 0.7%, 체크카드 0.4%입니다(영세 사업자 부가세·종소세는 더 낮음).</li>':'')+
    (chs.includes('위택스')?'<li><b>지방세(위택스)</b> — 위택스(wetax.go.kr)·스마트위택스, 은행 앱의 「지방세」 메뉴(전자납부번호), 가상계좌, ARS 142-211로 냅니다. 저희가 보내 드리는 지방세 납부서의 번호를 쓰시면 됩니다. 지방세는 국세와 기한이 다를 수 있으니 위 표의 기한을 확인하십시오.</li>':'')+
    (chs.includes('공단 고지')?'<li><b>4대보험료</b> — 공단 고지서의 가상계좌, 사회보험 통합징수포털(si4n.nhis.or.kr)의 즉시이체·카드, 또는 자동이체로 냅니다. 홈택스로는 낼 수 없습니다.</li>':'')+
    '<li>기한을 넘기면 납부지연가산세가 붙습니다. 자금 사정으로 기한 내 납부가 어려우면 기한 전에 담당자에게 알려 주십시오.</li></ul>'+
    '<h2>문의</h2><p>담당 '+esc(v('tStaff')||'세무법인 한백택스')+' · 전화 02-2277-3101 · hb090@hanbaektax.kr</p>'+
    '<div class="foot"><b>세무법인 한백택스</b> · 서울특별시 중구 동호로 315, 신안빌딩 2층<br>전화 02-2277-3101 · 팩스 02-2277-3161 · hb090@hanbaektax.kr · hb3101@nate.com</div>';
  /* 홈택스 입력값 */
  const N=L.filter(l=>l.ch==='홈택스'), W=L.filter(l=>l.ch==='위택스'), S=L.filter(l=>l.ch==='공단 고지');
  const vv=s=>'<span class="v" onclick="copyText(this.textContent)">'+esc(s)+'</span>';
  let h='';
  if(!L.length)h='<div class="empty">납부 항목을 넣으면 입력할 값이 나옵니다</div>';
  if(N.length){
    h+='<div class="note">'+HT_PATH+'</div>';
    /* 원천세는 소득 종류(세목)마다 납부서 1장 — 같은 세목(근로·연말정산)은 합친다 */
    const slips=[];
    N.forEach(l=>{const it=ITEMS.find(x=>x.id===l.iid);
      if(l.kind==='wht'){const m={};it.rows.filter(r=>r.a).forEach(r=>{const nm=r.t==='연말정산(근로)'?'근로소득':r.t;m[nm]=(m[nm]||0)+r.a;});
        Object.keys(m).forEach(nm=>slips.push({it,l,semok:nm+'세',code:SEMOK[nm],amt:m[nm]}));}
      else slips.push({it,l,semok:KINDS[l.kind].ht,code:SEMOK[KINDS[l.kind].ht],amt:l.amt});});
    slips.forEach((x,i)=>{const {it,l}=x;
      h+='<h3>'+(i+1)+'. '+esc(x.semok)+(l.kind==='wht'?'':' '+esc(l.det||''))+'</h3><ol>'+
      '<li>납세자번호 '+vv(fmtId(v('tId'))||'(번호 없음)')+'</li>'+
      '<li>세목 '+vv(x.semok)+(x.code?' <span style="font-size:12px;color:var(--gray)">(세목코드 '+x.code+')</span>':'')+'</li>'+
      '<li>귀속연월 '+vv(htPeriod(it))+(l.kind==='wht'?' <span style="font-size:12px;color:var(--gray)">지급 '+esc(htPay(it))+'</span>':'')+'</li>'+
      '<li>결정구분 '+vv(KYUL[kyul(it)])+'</li>'+
      '<li>납부할세액 '+vv(won(x.amt))+' · 납부기한 '+vv(l.due)+'</li></ol>';});
    h+='<div class="note">세목코드·결정구분 번호는 참고용입니다(세목코드는 민간 정리표, 국세청 고시 원문 대조 전). 화면에서는 세목 이름으로 고릅니다.</div>';
    h+='<div class="note">출력한 납부서를 안내서와 함께 거래처에 보내십시오. 홈택스로 전자신고한 건은 자진납부 대신 「조회납부」에 나오는 납부서를 그대로 씁니다. 기한후신고는 신고 당일이 지나면 조회납부에 나오지 않으므로 자진납부에서 직접 입력합니다(국세상담센터 FAQ).</div>';
  }
  if(W.length){
    h+='<h3 style="margin-top:16px">위택스 (지방세)</h3><div class="note">'+WT_PATH+'</div>';
    W.forEach((l,i)=>{const it=ITEMS.find(x=>x.id===l.iid);
      h+='<h3>'+(i+1)+'. '+esc(l.tax)+(/^[12]차/.test(l.det||'')?' '+esc(l.det.split(' ·')[0]):'')+'</h3><ol>'+
      '<li>납세자번호 '+vv(fmtId(v('tId'))||'(번호 없음)')+(it&&it.place?' · 납세지 '+vv(it.place):'')+'</li>'+
      '<li>메뉴 <span style="font-size:12.5px">'+esc(wtMenu(l))+'</span></li>'+
      '<li>귀속 · 기준 '+vv(l.per)+' · 신고 구분 '+vv(l.tp)+'</li>'+
      '<li>납부할세액 '+vv(won(l.amt))+' · 납부기한 '+vv(l.due)+' <span style="font-size:12px;color:var(--gray)">('+esc(l.why||'')+')</span></li></ol>';});
  }
  if(S.length)h+='<h3>4대보험료</h3><p style="font-size:13px">홈택스 입력 없음 — 공단 고지서 금액·가상계좌 그대로 안내합니다.</p>';
  $('htBody').innerHTML=h;
  /* 카톡 */
  const k=L.length?(name+' 대표님, 세무법인 한백택스 '+(v('tStaff')||'')+'입니다.\n이번에 납부하실 세금 안내드립니다.\n\n'+
    L.map(l=>'■ '+l.tax+(l.det?' '+l.det:'')+' ('+l.per+')\n  '+won(l.amt)+'원 / 기한 '+kdate(l.due)+' / '+l.ch).join('\n')+
    '\n\n합계 '+won(tot)+'원\n'+(N.length?'국세는 보내 드리는 납부서(납부번호)로 홈택스·은행 앱에서 납부하시면 됩니다.\n':'')+
    '기한이 지나면 가산세가 붙으니 기한 내 납부 부탁드립니다. 문의 02-2277-3101'):'';
  $('kakao').value=k;
}
function htPeriod(it){if(!it)return '';switch(it.kind){
  case 'wht':return it.cycle==='h'?(it.half.split('-')[1]==='1'?it.half.split('-')[0]+'년 1월':it.half.split('-')[0]+'년 7월'):ymK(it.ym)+'';
  case 'vat':{const [y,p]=it.vat.split('-');return y+'년 '+(p[0])+'기 '+(p.endsWith('p')?'예정':'확정');}
  case 'inc':return it.y+'년';
  case 'corp':return ymK(it.ym)+' (사업연도 종료)';
  default:return it.d?it.d.slice(0,7).replace('-','년 ')+'월':'';}}
function htPay(it){if(it.cycle==='h'){const [y,h]=it.half.split('-');return h==='1'?y+'년 6월':y+'년 12월';}return ymK(it.ym)+'';}

/* 위택스 — 1차 확인 2026-10-02: 특별징수 메뉴 광주광역시 「지방소득세(특별징수) 위택스 신고방법」, 종합소득분 연계 정책브리핑(행정안전부),
   납부 수단 위택스 「지방세 납부하기」(00:30~23:30, 계좌이체·카드·간편결제·가상계좌), ARS 142-211 은 지자체 안내(2차 자료). 그 밖의 세목 메뉴명은 실화면 미확인 */
const WT_PATH='위택스(wetax.go.kr)에서 신고하면 납부서(전자납부번호)가 나옵니다. 납세지는 사업장·주소지 관할 시·군·구입니다. 신고 후 위택스 「납부하기」, 은행 앱 「지방세」, 가상계좌, ARS 142-211로 냅니다.';
function wtMenu(l){
  if(/특별징수/.test(l.tax))return '위택스 「신고하기 → 지방소득세 → 특별징수」(한건신고·엑셀신고)';
  if(l.lk==='incLoc')return '홈택스 종합소득세 신고를 마친 뒤 「지방소득세 신고 이동」으로 위택스 연계 신고';
  if(l.lk==='trfLoc')return '위택스 「신고하기 → 지방소득세」의 양도소득 신고 (메뉴명 실화면 미확인)';
  if(l.lk==='corpLoc')return '위택스 「신고하기 → 지방소득세」의 법인지방소득세 신고 (메뉴명 실화면 미확인)';
  if(l.lk==='resBiz'||l.lk==='resEmp')return '위택스 「신고하기 → 주민세」 (메뉴명 실화면 미확인)';
  if(l.lk==='acq')return '위택스 「신고하기 → 취득세」 — 지방교육세·농어촌특별세 함께 (메뉴명 실화면 미확인)';
  return '위택스 「신고하기」의 해당 세목';
}
/* 홈택스 자진납부 경로 — 1차 확인 결과로 채움 */
/* 1차 확인 2026-10-02: 국세상담센터 「세액납부」 FAQ(call.nts.go.kr), 손택스 자진납부 화면(입력 항목: 세목·귀속연월·결정구분·납세자번호·납부할세액·납부기한),
   결정구분 1 확정분자납 · 2 수시분자납 · 3 중간예납·예정신고 · 4 원천분자납(국세청 양도소득세 납부서 작성요령). PC 개편 화면 메뉴명은 실화면 미확인. */
const HT_PATH='홈택스 「납부·고지·환급 → 납부 → 자진납부」(손택스 같은 메뉴)에서 아래 값을 넣고 납부서를 출력합니다. 귀속연월은 신고서의 귀속연월과 대조하십시오. 메뉴 이름은 홈택스 개편으로 바뀔 수 있습니다.';
const KYUL={1:'1 확정분자납',2:'2 수시분자납',3:'3 중간예납·예정신고',4:'4 원천분자납'};
function kyul(it){if(/수정|기한후/.test(it.type))return 2;if(it.kind==='wht')return 4;if(it.type==='중간예납'||it.type==='예정'||(it.kind==='vat'&&it.vat.endsWith('p')))return 3;return 1;}

/* ---------- 저장 ---------- */
function saveDraft(){try{localStorage.setItem(LS,JSON.stringify({t:{name:v('tName'),ceo:v('tCeo'),id:v('tId'),tel:v('tTel'),staff:v('tStaff'),date:v('tDate')},items:ITEMS}));}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(!d)return;const t=d.t||{};
  $('tName').value=t.name||'';$('tCeo').value=t.ceo||'';$('tId').value=t.id||'';$('tTel').value=t.tel||'';$('tStaff').value=t.staff||'';$('tDate').value=t.date||'';ITEMS=d.items||[];}catch(e){}}

$('tDate').value=today;
loadDraft();fillClients();renderKinds();renderForm();chkId();render();
window.HB_PAY={dueOf,linesOf,splitAmt,nextBiz,addMonths,ITEMS:()=>ITEMS};
</script>
