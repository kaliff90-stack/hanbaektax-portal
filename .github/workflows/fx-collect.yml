name: 세무환율 수집 (fx-data)

# 하는 일
#   평일 오전(KST 11:30, 14:00 재시도) 한국수출입은행 환율 API 로 그날의 매매기준율·TTB·TTS 를 받고,
#   관세청 UNI-PASS 주간환율(과세환율·수출환율)을 받아 fx-data 브랜치에 JSON 으로 쌓는다.
#   웹앱(한백택스_세무환율_조회.html)은 raw.githubusercontent 로 이 브랜치를 읽는다.
#     latest.json               최신 영업일 매매기준율
#     daily/YYYY-MM-DD.json     일자별 매매기준율 누적
#     customs/latest.json       최신 주 과세환율·수출환율
#     customs/YYYY-MM-DD.json   주 시작일(일요일)별 과세환율 누적
#     series/index.json         통화 목록·수집 범위
#     series/<통화코드>.json     통화별 일별(매매기준율·TTB·TTS)·주간(과세환율·수출환율) 시계열
#
# 필요한 비밀값 (Settings → Secrets and variables → Actions)
#   KOREAEXIM_KEY  필수. 한국수출입은행 Open API 인증키 (https://www.koreaexim.go.kr/ir/HPHKIR020M01 에서 무료 발급, 일 1,000회)
#   ECOS_KEY       권장. 한국은행 ECOS 인증키 (https://ecos.bok.or.kr/api/#/AuthKeyApply 무료 발급).
#                  수출입은행이 고시하지 않는 통화(브라질 헤알·멕시코 페소·튀르키예 리라 등 21개)의
#                  일별 재정환율을 채운다. 없으면 시험용 키로 당일분만 채우고 과거 백필은 못 한다.
#   관세청 주간환율은 UNI-PASS 공개 조회라 키가 필요 없다 (2026-09-09 확인).
#
# 과거 기간 일괄 수집 (backfill)
#   Actions 탭 → 이 워크플로 → Run workflow 에서 from/to 를 YYYYMMDD 로 넣는다. 예) from 20241202, to 20260909
#   수출입은행 일일 한도 1,000회를 넘지 않도록 한 번에 영업일 900일 이내로 나눠 실행한다.
#
# 배포 경로
#   이 파일은 볼트의 웹배포_공개용/.github/workflows/ 에 있고, 세무포털_배포.ps1 이 웹배포_공개용 트리를
#   공개 저장소 루트로 올리므로 공개 저장소에서는 .github/workflows/fx-collect.yml 이 된다.
#   fx-data 브랜치는 배포 스냅샷과 무관하게 이 워크플로만 갱신한다.

on:
  schedule:
    # GitHub 예약 실행은 부하 시 지연·누락된다(2026-09-10 11:30·14:00 둘 다 미실행 확인).
    # 평일 11:00~16:30 KST 를 30분 간격으로 걸어 놓는다. 이미 받은 날은 "변경 없음"으로 끝나 비용이 없다.
    - cron: '0,30 2-7 * * 1-5'   # 11:00 ~ 16:30 KST, 30분마다
  workflow_dispatch:
    inputs:
      date:
        description: '수집일 (YYYYMMDD). 비우면 오늘(KST)'
        required: false
        default: ''
      from:
        description: '일괄 수집 시작일 (YYYYMMDD). to 와 함께 지정'
        required: false
        default: ''
      to:
        description: '일괄 수집 종료일 (YYYYMMDD)'
        required: false
        default: ''
      customs_from:
        description: '관세청 과세환율만 다시 받을 시작일 (YYYYMMDD). 수출입은행 호출 없음, customs_to 와 함께'
        required: false
        default: ''
      customs_to:
        description: '관세청 과세환율만 다시 받을 종료일 (YYYYMMDD)'
        required: false
        default: ''
      ecos_from:
        description: '한국은행 ECOS 과거 매매기준율 수집 시작일 (YYYYMMDD). ECOS_KEY 비밀값 필요, ecos_to 와 함께'
        required: false
        default: ''
      ecos_to:
        description: 'ECOS 수집 종료일 (YYYYMMDD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fx-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: fx-data 브랜치 준비
        run: |
          git config user.name  "hanbaektax-fx-bot"
          git config user.email "hb090@hanbaektax.kr"
          if git ls-remote --exit-code --heads origin fx-data >/dev/null 2>&1; then
            git fetch origin fx-data
            git worktree add data origin/fx-data
            git -C data checkout -B fx-data origin/fx-data
          else
            git worktree add --detach data
            git -C data checkout --orphan fx-data
            git -C data rm -rfq .
            printf '# fx-data\n\n세무환율 조회 앱이 읽는 환율 데이터 브랜치. 워크플로 fx-collect.yml 이 자동 갱신한다.\n' > data/README.md
          fi

      - name: 관세청 접속 진단
        run: |
          echo "unipass.customs.go.kr DNS: $(getent hosts unipass.customs.go.kr || echo '해석 실패')"
          curl -sS -o /dev/null --max-time 15 -w 'HTTPS 443 → HTTP %{http_code} (%{time_total}s)\n' \
            "https://unipass.customs.go.kr/csp/myc/bsopspptinfo/dclrSpptInfo/WeekFxrtQryCtr/retrieveWeekFxrt.do?pageIndex=1&pageUnit=100&aplyDt=$(date -u +%Y-%m-%d)&weekFxrtTpcd=2" \
            || echo "curl 실패 (종료코드 $?) - 러너에서 관세청 접속 불가"
        continue-on-error: true

      - name: 수출입은행 접속 진단 · 중간 인증서 보강
        run: |
          curl -sS -o /dev/null --max-time 15 -w 'oapi.koreaexim.go.kr HTTPS 443 → HTTP %{http_code} (%{time_total}s)\n' \
            "https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON?authkey=x&searchdate=20260101&data=AP01" \
            || echo "curl 실패 (종료코드 $?) - 러너에서 수출입은행 접속 불가"
          # 수출입은행 서버가 중간 인증서(Thawte TLS RSA CA G1)를 빠뜨려 보내는 경우가 있어 Node 의 인증서 검증이 실패한다
          # (2026-09-11 로그: fetch failed / UNABLE_TO_VERIFY_LEAF_SIGNATURE). 발급기관(AIA)에서 받아 Node 신뢰 목록에 더한다.
          if curl -sS --max-time 15 -o "$RUNNER_TEMP/thawte-g1.crt" http://cacerts.thawte.com/ThawteTLSRSACAG1.crt \
             && { openssl x509 -inform DER -in "$RUNNER_TEMP/thawte-g1.crt" -out "$RUNNER_TEMP/extra-ca.pem" 2>/dev/null \
                  || openssl x509 -inform PEM -in "$RUNNER_TEMP/thawte-g1.crt" -out "$RUNNER_TEMP/extra-ca.pem" 2>/dev/null; }; then
            echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/extra-ca.pem" >> "$GITHUB_ENV"
            echo "중간 인증서 보강: $(openssl x509 -in "$RUNNER_TEMP/extra-ca.pem" -noout -subject)"
          else
            echo "중간 인증서 내려받기 실패 - 수집 단계의 curl 대체 경로에 의존"
          fi
        continue-on-error: true

      - name: 환율 수집
        env:
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
          TARGET_DATE: ${{ github.event.inputs.date }}
          RANGE_FROM: ${{ github.event.inputs.from }}
          RANGE_TO: ${{ github.event.inputs.to }}
          CUSTOMS_FROM: ${{ github.event.inputs.customs_from }}
          CUSTOMS_TO: ${{ github.event.inputs.customs_to }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          ECOS_FROM: ${{ github.event.inputs.ecos_from }}
          ECOS_TO: ${{ github.event.inputs.ecos_to }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const OUT = 'data';
          const key = process.env.KOREAEXIM_KEY;
          if (!key) { console.error('KOREAEXIM_KEY 비밀값이 없습니다. 수출입은행 인증키를 등록하십시오.'); process.exit(1); }

          const num = s => { const v = parseFloat(String(s ?? '').replace(/,/g, '')); return isNaN(v) ? null : v; };
          const nowIso = new Date().toISOString();
          const toDash = ymd => ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8);
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          /* ── 수집 대상 일자 ── */
          const kstToday = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10).replace(/-/g, '');
          const from = (process.env.RANGE_FROM || '').trim(), to = (process.env.RANGE_TO || '').trim();
          const ecosFrom = (process.env.ECOS_FROM || '').trim(), ecosTo = (process.env.ECOS_TO || '').trim();
          const customsFrom = (process.env.CUSTOMS_FROM || '').trim(), customsTo = (process.env.CUSTOMS_TO || '').trim();
          const hasTarget = !!(process.env.TARGET_DATE || '').trim();
          const specialOnly = !(from && to) && !hasTarget && !!((ecosFrom && ecosTo) || (customsFrom && customsTo));
          let days = [];
          if (specialOnly) {
            /* ECOS·과세환율만 수집하는 실행: 수출입은행 호출은 하지 않는다 */
          } else if (from && to) {
            if (!/^\d{8}$/.test(from) || !/^\d{8}$/.test(to) || from > to) { console.error('from/to 형식 오류 (YYYYMMDD, from <= to)'); process.exit(1); }
            for (let d = new Date(toDash(from) + 'T00:00:00Z'); d.toISOString().slice(0, 10).replace(/-/g, '') <= to; d.setUTCDate(d.getUTCDate() + 1)) {
              const dow = d.getUTCDay();
              if (dow !== 0 && dow !== 6) days.push(d.toISOString().slice(0, 10).replace(/-/g, ''));
            }
            if (days.length > 900) { console.error(`영업일 ${days.length}일은 일일 한도(1,000회)에 걸립니다. 900일 이내로 나눠 실행하십시오.`); process.exit(1); }
          } else {
            days = [(process.env.TARGET_DATE || '').trim() || kstToday];
          }
          if (days.length) console.log(`수집 대상: ${days.length}일 (${toDash(days[0])} ~ ${toDash(days[days.length - 1])})`);

          /* 네트워크·TLS 오류는 4회까지 재시도한다(5·10·15초 간격). 러너(해외 IP)에서는 수출입은행 서버가 중간 인증서를 빠뜨려
           * UNABLE_TO_VERIFY_LEAF_SIGNATURE 가 나거나 접속이 끊긴다(2026-09-11 로그). 워크플로가 NODE_EXTRA_CA_CERTS 로 인증서를 보강하고,
           * 그래도 fetch 가 실패하면 같은 요청을 curl 로 다시 보낸다(같은 시각 curl 은 200 응답). 사무실 PC 에서도 curl.exe 가 있어 그대로 돈다. */
          const { execFileSync } = require('child_process');
          function curlText(url) {
            return execFileSync('curl', ['-sS', '--fail', '--max-time', '25', '-A', 'hanbaektax-fx-collect', url], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          }
          async function fetchText(url) {
            let lastErr;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const r = await fetch(url, { headers: { 'User-Agent': 'hanbaektax-fx-collect' }, signal: AbortSignal.timeout(25000) });
                if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url.replace(/authkey=[^&]+/g, 'authkey=***'));
                return await r.text();
              } catch (e) {
                lastErr = e;
                if (/^HTTP /.test(e.message)) throw e;      /* 서버 응답이 온 오류는 재시도하지 않는다 */
                const cause = e.cause ? (e.cause.code || e.cause.message || String(e.cause)) : e.message;
                try { const t = curlText(url); console.warn(`fetch 실패(${cause}) → curl 로 대체 성공`); return t; }
                catch (ce) { console.warn(`fetch 실패(${cause}) · curl 도 실패(${String(ce.stderr || ce.message || '').trim().slice(0, 120)}) — 시도 ${attempt}/4`); }
                if (attempt < 4) await sleep(5000 * attempt);
              }
            }
            throw lastErr;
          }
          function writeIfNewer(file, doc, dateKey) {
            let prev = '';
            try { prev = JSON.parse(fs.readFileSync(file, 'utf8'))[dateKey] || ''; } catch (e) {}
            if (doc[dateKey] >= prev) fs.writeFileSync(file, JSON.stringify(doc, null, 1));
          }

          /* ── 1) 수출입은행 AP01: 매매기준율 · TTB · TTS ── */
          async function exim(ymd) {
            const raw = await fetchText(`https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON?authkey=${key}&searchdate=${ymd}&data=AP01`);
            let arr; try { arr = JSON.parse(raw); } catch (e) { throw new Error('수출입은행 응답이 JSON 이 아닙니다: ' + raw.slice(0, 200)); }
            if (!Array.isArray(arr)) throw new Error('수출입은행 응답 형식 오류');
            if (arr.length === 0) return null;                       /* 비영업일 또는 미고시 */
            if (arr[0].result !== 1) throw new Error('수출입은행 result=' + arr[0].result + ' (2 DATA코드 오류, 3 인증코드 오류, 4 일일제한 초과)');
            /* base 는 서울외국환중개 매매기준율(kftc_deal_bas_r)을 우선하고, 없으면 수출입은행 매매기준율(deal_bas_r). 두 값을 모두 남긴다. */
            const rates = arr.map(r => ({ unit: r.cur_unit, name: r.cur_nm,
                                          base: num(r.kftc_deal_bas_r) ?? num(r.deal_bas_r), exim_base: num(r.deal_bas_r), kftc_base: num(r.kftc_deal_bas_r),
                                          ttb: num(r.ttb), tts: num(r.tts) }))
                             .filter(r => r.unit && r.unit !== 'KRW' && r.base !== null);
            return { date: toDash(ymd), source: '한국수출입은행 환율 API (AP01) · 매매기준율은 서울외국환중개(KFTC_DEAL_BAS_R) 값', fetched_at: nowIso, rates };
          }

          /* ── 2) 관세청 주간환율 — UNI-PASS 공개 조회(로그인·키 불필요, 2026-09-09 확인) ──
           * 정보조회 → 신고지원정보 → 주간환율 화면이 쓰는 JSON. weekFxrtTpcd 1=수출, 2=수입(과세). aplyDt 가 속한 주(일~토)를 돌려준다.
           * 응답: { aplyDtStrtDd, aplyDtEndDd, count, items:[{ currCd, currNm, intnCurrEnglNm, weekFxrt, beforeWeekFxrt }] }
           * 환율은 1 통화단위당 원(엔도 1엔 기준). */
          async function customsOne(dash, tpcd) {
            const raw = await fetchText(`https://unipass.customs.go.kr/csp/myc/bsopspptinfo/dclrSpptInfo/WeekFxrtQryCtr/retrieveWeekFxrt.do?pageIndex=1&pageUnit=100&aplyDt=${dash}&weekFxrtTpcd=${tpcd}`);
            let d; try { d = JSON.parse(raw); } catch (e) { throw new Error('관세청 응답이 JSON 이 아닙니다: ' + raw.slice(0, 200)); }
            const items = (d.items || []).map(r => ({ unit: r.currCd, name: r.currNm, name_en: r.intnCurrEnglNm, rate: num(r.weekFxrt), prev: num(r.beforeWeekFxrt) }))
                                          .filter(r => r.unit && r.unit !== 'KRW' && r.rate !== null);
            if (!items.length) throw new Error('관세청 응답에 항목 없음: ' + raw.slice(0, 200));
            return { start: d.aplyDtStrtDd || '', end: d.aplyDtEndDd || '', items };
          }
          async function customs(dash) {
            const [imp, exp] = await Promise.all([customsOne(dash, 2), customsOne(dash, 1)]);
            return { week_start: imp.start, week_end: imp.end, fetched_at: nowIso, unit_note: '원/1통화단위 (엔·루피아 포함)',
                     source: '관세청 UNI-PASS 주간환율 조회 (정보조회 › 신고지원정보 › 주간환율)', import: imp.items, export: exp.items };
          }

          (async () => {
            fs.mkdirSync(path.join(OUT, 'daily'), { recursive: true });
            fs.mkdirSync(path.join(OUT, 'customs'), { recursive: true });
            let saved = 0, skipped = 0, failed = 0;

            /* 매매기준율: 일자별 */
            for (const ymd of days) {
              try {
                const doc = await exim(ymd);
                if (!doc) { skipped++; if (days.length === 1) console.log(`${toDash(ymd)}: 고시 없음(비영업일 또는 미고시)`); }
                else {
                  fs.writeFileSync(path.join(OUT, 'daily', doc.date + '.json'), JSON.stringify(doc, null, 1));
                  writeIfNewer(path.join(OUT, 'latest.json'), doc, 'date');
                  saved++;
                  if (days.length === 1 || saved % 50 === 0) console.log(`${doc.date}: ${doc.rates.length} 통화 저장. USD 매매기준율 ${doc.rates.find(r => r.unit === 'USD')?.base}`);
                }
              } catch (e) {
                failed++; console.error(`${toDash(ymd)}: ${e.message}` + (e.cause ? ` / 원인: ${e.cause.code || e.cause.message || e.cause}` : ''));
                if (/result=[34]/.test(e.message)) { console.error('인증키 또는 일일 한도 문제로 중단합니다.'); break; }
              }
              if (days.length > 1) await sleep(250);
            }
            if (days.length) console.log(`매매기준율: 저장 ${saved} · 고시없음 ${skipped} · 실패 ${failed}`);
            if (days.length && saved === 0 && failed > 0) process.exit(1);

            /* ── 1-1) 한국은행 ECOS 매매기준율·재정환율 ──
             * 통계표 731Y001 "주요국 통화의 대원화환율"(일별). 두 가지로 쓴다.
             *  (1) 보완 — 수출입은행 AP01 이 고시하지 않는 통화(브라질 헤알·멕시코 페소·튀르키예 리라 등 21개)를
             *             그날 수집본에 합친다. ECOS_KEY 가 있으면 정기 실행마다 자동으로 돈다.
             *  (2) 백필 — ecos_from/ecos_to 를 주면 전 통화의 과거 구간을 채운다(수출입은행 일일 한도 회피).
             * 매매기준율·재정환율만 있고 TTB/TTS 는 없다. 같은 날·같은 통화가 이미 있으면 덮어쓰지 않는다(수출입은행 우선).
             * 호출: https://ecos.bok.or.kr/api/StatisticSearch/{KEY}/json/kr/1/1000/731Y001/D/{from}/{to}/{item}
             * 응답: { StatisticSearch: { list_total_count, row:[{ TIME:'20230102', DATA_VALUE:'1267.3', ... }] } }
             * 2026-09-09 검증: 20260909 USD 1341.1 = 수출입은행 KFTC 매매기준율과 일치
             * 2026-09-14 확인: 731Y001 항목 53개 중 현재 고시 중인 43개 등록(나머지 10개는 유로 도입 등으로 고시 종료) */
            /* ECOS_KEY 가 없으면 한국은행이 공개한 시험용 키 sample 로 당일 보완만 돌린다(1회 10행 한도).
             * 과거 백필은 행 수가 커서 시험용 키로는 안 되므로 정식 키를 요구한다.
             * 정식 키는 https://ecos.bok.or.kr/api/#/AuthKeyApply 에서 무료 발급받아
             *   gh secret set ECOS_KEY --repo kaliff90-stack/hanbaektax-portal
             * 로 등록한다. */
            let ecosKey = process.env.ECOS_KEY || 'sample';
            let ecosSample = !process.env.ECOS_KEY;
            let ecosRows = ecosSample ? 10 : 1000;
            /* 등록된 키가 거부되면(발급 직후 미활성·오타) 시험용 키로 되돌린다. 당일 보완이라도 계속 돌게 한다. */
            function ecosFallbackToSample() {
              if (ecosSample) return false;
              ecosKey = 'sample'; ecosSample = true; ecosRows = 10;
              return true;
            }
            /* 수출입은행 AP01 이 함께 고시하는 통화. 과거 백필에만 쓴다. */
            const ECOS_EXIM = [
              ['USD', '0000001', '미국 달러'], ['JPY(100)', '0000002', '일본 옌'], ['EUR', '0000003', '유로'], ['CNH', '0000053', '위안화'],
              ['GBP', '0000012', '영국 파운드'], ['CAD', '0000013', '캐나다 달러'], ['CHF', '0000014', '스위스 프랑'], ['AUD', '0000017', '호주 달러'],
              ['NZD', '0000026', '뉴질랜드 달러'], ['HKD', '0000015', '홍콩 달러'], ['THB', '0000028', '태국 바트'], ['SGD', '0000024', '싱가포르 달러'],
              ['IDR(100)', '0000029', '인도네시아 루피아'], ['MYR', '0000025', '말레이지아 링기트'], ['BND', '0000036', '브루나이 달러'],
              ['SEK', '0000016', '스웨덴 크로나'], ['DKK', '0000018', '덴마아크 크로네'], ['NOK', '0000019', '노르웨이 크로네'],
              ['SAR', '0000020', '사우디 리얄'], ['KWD', '0000021', '쿠웨이트 디나르'], ['BHD', '0000022', '바레인 디나르'], ['AED', '0000023', '아랍에미리트 디르함'],
            ];
            /* 수출입은행이 고시하지 않는 통화 — 한국은행 재정환율. 정기 실행 때도 함께 받아 그날 표에 합친다.
             * 통화코드는 관세청 주간환율 표기에 맞춘다. 베트남 동만 100동 기준(ECOS 원자료 단위). */
            const ECOS_EXTRA = [
              ['BRL', '0000041', '브라질 헤알'], ['MXN', '0000040', '멕시코 페소'], ['ARS', '0000042', '아르헨티나 페소'],
              ['TRY', '0000050', '튀르키예 리라'], ['ZAR', '0000051', '남아프리카공화국 랜드'], ['EGP', '0000052', '이집트 파운드'],
              ['RUB', '0000043', '러시아 루블'], ['HUF', '0000044', '헝가리 포린트'], ['PLN', '0000045', '폴란드 즈워티'], ['CZK', '0000046', '체코 코루나'],
              ['QAR', '0000047', '카타르 리얄'], ['ILS', '0000048', '이스라엘 셰켈'], ['JOD', '0000049', '요르단 디나르'],
              ['INR', '0000037', '인도 루피'], ['PKR', '0000038', '파키스탄 루피'], ['BDT', '0000039', '방글라데시 타카'],
              ['TWD', '0000031', '대만 달러'], ['PHP', '0000034', '필리핀 페소'], ['VND(100)', '0000035', '베트남 동'],
              ['MNT', '0000032', '몽골 투그릭'], ['KZT', '0000033', '카자흐스탄 텡게'],
            ];
            /* 1회 1,000행 한도 → 연 단위로 나눠 호출 */
            function yearChunks(a, b) {
              const out = [];
              for (let y = +a.slice(0, 4); y <= +b.slice(0, 4); y++) {
                const s = Math.max(+a, y * 10000 + 101), e = Math.min(+b, y * 10000 + 1231);
                if (s <= e) out.push([String(s), String(e)]);
              }
              return out;
            }
            /* 통화 목록 × 기간을 받아 날짜별로 모은다. 인증키 문제면 null 을 돌려준다. */
            async function ecosPull(items, from, to) {
              const byDate = {};
              let calls = 0, rows = 0, fails = 0, empty = 0;
              for (const [a, b] of yearChunks(from, to)) {
                for (const [unit, item, name] of items) {
                  try {
                    const raw = await fetchText(`https://ecos.bok.or.kr/api/StatisticSearch/${ecosKey}/json/kr/1/${ecosRows}/731Y001/D/${a}/${b}/${item}`);
                    let d; try { d = JSON.parse(raw); } catch (e) { throw new Error('ECOS 응답이 JSON 이 아닙니다: ' + raw.slice(0, 120)); }
                    /* 휴장일·공휴일은 INFO-200(데이터 없음)을 돌려준다. 오류가 아니라 정상이다. */
                    if (d.RESULT && d.RESULT.CODE === 'INFO-200') { calls++; empty++; await sleep(200); continue; }
                    if (d.RESULT) throw new Error(`ECOS ${d.RESULT.CODE}: ${String(d.RESULT.MESSAGE).split('\n')[0]}`);
                    for (const r of (d.StatisticSearch && d.StatisticSearch.row) || []) {
                      const v = num(r.DATA_VALUE);
                      if (v === null || !/^\d{8}$/.test(r.TIME)) continue;
                      (byDate[r.TIME] ||= []).push({ unit, name, base: v, ttb: null, tts: null, src: 'ecos' });
                      rows++;
                    }
                    calls++;
                  } catch (e) {
                    fails++; console.error(`ECOS ${unit} ${a}~${b}: ${e.message}`);
                    if (/ECOS (INFO-100|ERROR-1)/.test(e.message)) { console.error('ECOS 인증키 문제로 중단합니다.'); return null; }
                  }
                  await sleep(200);
                }
              }
              return { byDate, calls, rows, fails, empty };
            }
            /* 같은 날 파일이 있으면 빠진 통화만 보태고, 없으면 새로 쓴다. 최신일이면 latest.json 도 다시 쓴다. */
            function ecosMerge(byDate) {
              const ECOS_SRC = '한국은행 ECOS 731Y001 주요국 통화의 대원화환율 (매매기준율·재정환율, TTB/TTS 없음)';
              let made = 0, added = 0, addedRows = 0, kept = 0;
              for (const ymd of Object.keys(byDate).sort()) {
                const dash = toDash(ymd), file = path.join(OUT, 'daily', dash + '.json');
                let doc = null;
                if (fs.existsSync(file)) { try { doc = JSON.parse(fs.readFileSync(file, 'utf8')); } catch (e) { doc = null; } }
                if (doc && Array.isArray(doc.rates) && doc.rates.length) {
                  const have = new Set(doc.rates.map(r => r.unit));
                  const add = byDate[ymd].filter(r => !have.has(r.unit));
                  if (!add.length) { kept++; continue; }
                  doc.rates = doc.rates.concat(add);
                  doc.ecos_note = `한국은행 ECOS 재정환율 ${add.length} 통화 보완 (TTB/TTS 없음)`;
                  doc.ecos_fetched_at = nowIso;
                  fs.writeFileSync(file, JSON.stringify(doc, null, 1));
                  added++; addedRows += add.length;
                } else {
                  doc = { date: dash, source: ECOS_SRC, fetched_at: nowIso, rates: byDate[ymd] };
                  fs.writeFileSync(file, JSON.stringify(doc, null, 1));
                  made++;
                }
                writeIfNewer(path.join(OUT, 'latest.json'), doc, 'date');
              }
              return { made, added, addedRows, kept };
            }

            /* (1) 정기 실행 보완 — 이번에 받은 날짜의 수출입은행 미고시 통화를 채운다.
             * 정기 실행은 평일 30분마다 돌기 때문에, 그날 파일에 이미 들어 있는 통화는 다시 받지 않는다.
             * 하루 한 번만 실제로 호출되고 그 뒤 실행은 호출 0 이 된다. */
            if (days.length) {
              let want = ECOS_EXTRA;
              if (days.length === 1) {
                const f = path.join(OUT, 'daily', toDash(days[0]) + '.json');
                if (fs.existsSync(f)) {
                  try {
                    const have = new Set((JSON.parse(fs.readFileSync(f, 'utf8')).rates || []).map(r => r.unit));
                    want = ECOS_EXTRA.filter(x => !have.has(x[0]));
                  } catch (e) { /* 파일이 깨졌으면 전부 다시 받는다 */ }
                }
              }
              if (!want.length) {
                console.log('ECOS 보완: 그날 수집본에 미고시 통화가 이미 다 들어 있어 호출하지 않습니다.');
              } else {
                if (ecosSample) console.warn(`ECOS_KEY 비밀값이 없어 시험용 키(sample)로 ${want.length} 통화만 보완합니다. 정식 키 등록을 권합니다.`);
                let got = await ecosPull(want, days[0], days[days.length - 1]);
                if (!got && ecosFallbackToSample()) {
                  console.warn('등록된 ECOS_KEY 가 거부됐습니다(발급 직후라 아직 활성화되지 않았거나 값이 잘못됐을 수 있습니다). 시험용 키(sample)로 다시 시도합니다.');
                  got = await ecosPull(want, days[0], days[days.length - 1]);
                }
                if (got) {
                  const m = ecosMerge(got.byDate);
                  console.log(`ECOS 보완(${want.length} 통화 요청): 호출 ${got.calls} · 행 ${got.rows} · 고시없음 ${got.empty} · 실패 ${got.fails} · 보탠 날 ${m.added}일(${m.addedRows}건) · 새로 만든 날 ${m.made}일 · 이미 있음 ${m.kept}일`);
                }
              }
            }

            /* (2) 과거 백필 — ecos_from/ecos_to 를 준 실행에서만 전 통화를 받는다 */
            if (ecosFrom && ecosTo) {
              if (ecosSample) { console.error('과거 백필에는 정식 ECOS_KEY 비밀값이 필요합니다(시험용 키는 1회 10행 한도). https://ecos.bok.or.kr/api/#/AuthKeyApply 에서 발급 후 등록하십시오.'); process.exit(1); }
              if (!/^\d{8}$/.test(ecosFrom) || !/^\d{8}$/.test(ecosTo) || ecosFrom > ecosTo) { console.error('ecos_from/ecos_to 형식 오류'); process.exit(1); }
              const got = await ecosPull(ECOS_EXIM.concat(ECOS_EXTRA), ecosFrom, ecosTo);
              if (!got) {
                console.error('백필은 시험용 키로 대신할 수 없습니다(1회 10행 한도). ECOS_KEY 를 확인하십시오 — 발급 직후에는 활성화까지 하루 정도 걸립니다.');
                console.error('키 점검: curl "https://ecos.bok.or.kr/api/StatisticSearch/<키>/json/kr/1/1/731Y001/D/20260911/20260911/0000001"');
                process.exit(1);
              }
              const m = ecosMerge(got.byDate);
              console.log(`ECOS 백필: 호출 ${got.calls} · 행 ${got.rows} · 고시없음 ${got.empty} · 실패 ${got.fails} · 새로 만든 날 ${m.made}일 · 통화 보탠 날 ${m.added}일(${m.addedRows}건) · 그대로 둔 날 ${m.kept}일 (${toDash(ecosFrom)}~${toDash(ecosTo)})`);
            }

            /* 과세환율: 주(일요일 시작)별 한 번씩. customs_from/customs_to 가 있으면 그 기간의 주만(수출입은행 호출 없이) 받는다 */
            let weekSrc = days;
            if (customsFrom && customsTo) {
              if (!/^\d{8}$/.test(customsFrom) || !/^\d{8}$/.test(customsTo) || customsFrom > customsTo) { console.error('customs_from/customs_to 형식 오류'); process.exit(1); }
              weekSrc = [];
              for (let d = new Date(toDash(customsFrom) + 'T00:00:00Z'); d.toISOString().slice(0, 10).replace(/-/g, '') <= customsTo; d.setUTCDate(d.getUTCDate() + 7)) weekSrc.push(d.toISOString().slice(0, 10).replace(/-/g, ''));
              weekSrc.push(customsTo);
            }
            const weeks = [...new Set(weekSrc.map(ymd => { const d = new Date(toDash(ymd) + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d.toISOString().slice(0, 10); }))];
            let cs = 0, cf = 0;
            for (const sunday of weeks) {
              try {
                const cdoc = await customs(sunday);
                if (cdoc.week_start) fs.writeFileSync(path.join(OUT, 'customs', cdoc.week_start + '.json'), JSON.stringify(cdoc, null, 1));
                writeIfNewer(path.join(OUT, 'customs', 'latest.json'), cdoc, 'week_start');
                cs++;
                if (weeks.length === 1 || cs % 20 === 0) console.log(`과세환율 ${cdoc.week_start}~${cdoc.week_end}: 수입 ${cdoc.import.length} · 수출 ${cdoc.export.length} 통화. USD 과세환율 ${cdoc.import.find(r => r.unit === 'USD')?.rate}`);
              } catch (e) {
                /* 과세환율 실패는 전체 실패로 만들지 않는다. 매매기준율만이라도 올린다. */
                cf++; console.warn(`과세환율 ${sunday} 실패 (계속 진행): ${e.message}${e.cause ? ' / 원인: ' + (e.cause.code || e.cause.message || e.cause) : ''}`);
                if (cf >= 3 && cs === 0) { console.warn('관세청 접속이 계속 실패해 이번 실행의 과세환율 수집을 중단합니다.'); break; }
              }
              if (weeks.length > 1) await sleep(250);
            }
            if (weeks.length) console.log(`과세환율: 저장 ${cs} 주 · 실패 ${cf} 주`);

            /* ── 3) 통화별 시계열 파일 — 앱의 "통화별 기간 조회"용. 매 실행마다 daily/·customs/ 전체를 다시 훑어 만든다 ──
             * series/index.json          { updated, daily_from, daily_to, weekly_from, weekly_to, currencies:[{code, unit, name, daily, weekly}] }
             * series/<code>.json         { code, unit, name, daily:[[date, base, ttb, tts]...], weekly:[[week_start, week_end, import, export]...] }
             * code 는 통화코드(JPY(100) → JPY). 관세청 CNY 는 수출입은행 CNH 시계열에 붙인다. */
            const codeOf = unit => String(unit).replace(/\(.*\)$/, '');
            const series = {};
            const listDated = dir => fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => /^\d{4}-\d{2}-\d{2}\.json$/.test(f)).sort() : [];
            const dailyFiles = listDated(path.join(OUT, 'daily'));
            for (const f of dailyFiles) {
              let doc; try { doc = JSON.parse(fs.readFileSync(path.join(OUT, 'daily', f), 'utf8')); } catch (e) { continue; }
              for (const r of doc.rates || []) {
                const c = codeOf(r.unit);
                (series[c] ||= { code: c, unit: r.unit, name: r.name, daily: [], weekly: [] }).daily.push([doc.date, r.base, r.ttb, r.tts]);
              }
            }
            const weekFiles = listDated(path.join(OUT, 'customs'));
            for (const f of weekFiles) {
              let doc; try { doc = JSON.parse(fs.readFileSync(path.join(OUT, 'customs', f), 'utf8')); } catch (e) { continue; }
              const exp = new Map((doc.export || []).map(r => [r.unit, r.rate]));
              for (const r of doc.import || []) {
                const c = (r.unit === 'CNY' && series.CNH) ? 'CNH' : r.unit;
                (series[c] ||= { code: c, unit: c, name: r.name, daily: [], weekly: [] }).weekly.push([doc.week_start, doc.week_end, r.rate, exp.get(r.unit) ?? null]);
              }
            }
            const codes = Object.keys(series);
            if (codes.length) {
              fs.mkdirSync(path.join(OUT, 'series'), { recursive: true });
              for (const c of codes) fs.writeFileSync(path.join(OUT, 'series', c + '.json'), JSON.stringify(series[c]));
              const allDaily = dailyFiles.map(f => f.slice(0, 10)), allWeek = weekFiles.map(f => f.slice(0, 10));
              const index = { updated: nowIso, daily_from: allDaily[0] || '', daily_to: allDaily[allDaily.length - 1] || '', weekly_from: allWeek[0] || '', weekly_to: allWeek[allWeek.length - 1] || '',
                              currencies: codes.sort().map(c => ({ code: c, unit: series[c].unit, name: series[c].name, daily: series[c].daily.length, weekly: series[c].weekly.length })) };
              fs.writeFileSync(path.join(OUT, 'series', 'index.json'), JSON.stringify(index, null, 1));
              console.log(`시계열: ${codes.length} 통화 · 일별 ${allDaily.length}일 (${index.daily_from}~${index.daily_to}) · 주간 ${allWeek.length}주`);
            }
          })().catch(e => { console.error(e.message); process.exit(1); });
          EOF

      - name: fx-data 커밋 · 푸시
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 - 푸시 생략"
          else
            git commit -m "환율 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # 실행 중 다른 실행이 먼저 푸시했을 수 있다. 최신 브랜치 위에 얹고(충돌 시 이번 수집분 우선) 푸시한다.
            git fetch origin fx-data
            git rebase -X theirs origin/fx-data || { git rebase --abort; echo "리베이스 실패 - 강제 없이 중단"; exit 1; }
            git push origin fx-data
          fi
