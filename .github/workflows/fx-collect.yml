name: 세무환율 수집 (fx-data)

# 하는 일
#   평일 오전(KST 11:30, 14:00 재시도) 한국수출입은행 환율 API 로 그날의 매매기준율·TTB·TTS 를 받아
#   fx-data 브랜치에 JSON 으로 쌓는다. 웹앱(한백택스_세무환율_조회.html)은 raw.githubusercontent 로 이 브랜치를 읽는다.
#     latest.json               최신 영업일
#     daily/YYYY-MM-DD.json     일자별 누적
#     customs/latest.json       관세청 주간 과세환율·수출환율 (UNIPASS_KEY 가 있을 때만)
#
# 필요한 비밀값 (Settings → Secrets and variables → Actions)
#   KOREAEXIM_KEY  필수. 한국수출입은행 Open API 인증키 (https://www.koreaexim.go.kr/ir/HPHKIR020M01 에서 무료 발급, 일 1,000회)
#   UNIPASS_KEY    선택. 관세청 UNI-PASS Open API 환율정보조회(API030) 인증키
#
# 배포 경로
#   이 파일은 볼트의 웹배포_공개용/.github/workflows/ 에 있고, 세무포털_배포.ps1 이 웹배포_공개용 트리를
#   공개 저장소 루트로 올리므로 공개 저장소에서는 .github/workflows/fx-collect.yml 이 된다.
#   fx-data 브랜치는 배포 스냅샷과 무관하게 이 워크플로만 갱신한다.

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 11:30 KST
    - cron: '0 5 * * 1-5'    # 14:00 KST (오전 실패·미고시 대비 재시도)
  workflow_dispatch:
    inputs:
      date:
        description: '수집일 (YYYYMMDD). 비우면 오늘(KST). 과거 일자 보충에 사용'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fx-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: fx-data 브랜치 준비
        run: |
          git config user.name  "hanbaektax-fx-bot"
          git config user.email "hb090@hanbaektax.kr"
          if git ls-remote --exit-code --heads origin fx-data >/dev/null 2>&1; then
            git fetch origin fx-data
            git worktree add data origin/fx-data
            git -C data checkout -B fx-data origin/fx-data
          else
            git worktree add --detach data
            git -C data checkout --orphan fx-data
            git -C data rm -rfq .
            printf '# fx-data\n\n세무환율 조회 앱이 읽는 환율 데이터 브랜치. 워크플로 fx-collect.yml 이 자동 갱신한다.\n' > data/README.md
          fi

      - name: 환율 수집
        env:
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
          UNIPASS_KEY: ${{ secrets.UNIPASS_KEY }}
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const OUT = 'data';
          const key = process.env.KOREAEXIM_KEY;
          if (!key) { console.error('KOREAEXIM_KEY 비밀값이 없습니다. 수출입은행 인증키를 등록하십시오.'); process.exit(1); }

          const kst = new Date(Date.now() + 9 * 3600 * 1000);
          const today = kst.toISOString().slice(0, 10).replace(/-/g, '');
          const ymd = (process.env.TARGET_DATE || '').trim() || today;
          const dash = ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8);
          const num = s => { const v = parseFloat(String(s ?? '').replace(/,/g, '')); return isNaN(v) ? null : v; };
          const nowIso = new Date().toISOString();

          async function fetchText(url) {
            const r = await fetch(url, { headers: { 'User-Agent': 'hanbaektax-fx-collect' } });
            if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url.replace(/authkey=[^&]+|crkyCn=[^&]+/g, '***'));
            return r.text();
          }

          (async () => {
            /* ── 1) 수출입은행 AP01: 매매기준율(deal_bas_r) · 송금받을때(ttb) · 송금보낼때(tts) ── */
            const url = `https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON?authkey=${key}&searchdate=${ymd}&data=AP01`;
            const raw = await fetchText(url);
            let arr; try { arr = JSON.parse(raw); } catch (e) { throw new Error('수출입은행 응답이 JSON 이 아닙니다: ' + raw.slice(0, 200)); }
            if (!Array.isArray(arr)) throw new Error('수출입은행 응답 형식 오류');
            if (arr.length === 0) { console.log(`${dash}: 고시 없음(비영업일 또는 미고시). 종료.`); return; }
            if (arr[0].result !== 1) { throw new Error('수출입은행 result=' + arr[0].result + ' (2 DATA코드 오류, 3 인증코드 오류, 4 일일제한 초과)'); }

            /* base 는 서울외국환중개 매매기준율(kftc_deal_bas_r)을 우선하고, 없으면 수출입은행 매매기준율(deal_bas_r). 두 값을 모두 남긴다. */
            const rates = arr.map(r => ({ unit: r.cur_unit, name: r.cur_nm,
                                          base: num(r.kftc_deal_bas_r) ?? num(r.deal_bas_r), exim_base: num(r.deal_bas_r), kftc_base: num(r.kftc_deal_bas_r),
                                          ttb: num(r.ttb), tts: num(r.tts) }))
                             .filter(r => r.unit && r.unit !== 'KRW' && r.base !== null);
            const doc = { date: dash, source: '한국수출입은행 환율 API (AP01) · 매매기준율은 서울외국환중개(KFTC_DEAL_BAS_R) 값', fetched_at: nowIso, rates };
            fs.mkdirSync(path.join(OUT, 'daily'), { recursive: true });
            fs.writeFileSync(path.join(OUT, 'daily', dash + '.json'), JSON.stringify(doc, null, 1));

            /* latest 는 더 최신 일자로만 덮어쓴다 (과거 보충 실행이 최신본을 되돌리지 않도록) */
            const latestPath = path.join(OUT, 'latest.json');
            let prevDate = '';
            try { prevDate = JSON.parse(fs.readFileSync(latestPath, 'utf8')).date || ''; } catch (e) {}
            if (dash >= prevDate) fs.writeFileSync(latestPath, JSON.stringify(doc, null, 1));
            console.log(`${dash}: ${rates.length} 통화 저장. USD 매매기준율 ${rates.find(r => r.unit === 'USD')?.base}`);

            /* ── 2) 관세청 UNI-PASS 환율정보조회 (선택) ── */
            const ukey = process.env.UNIPASS_KEY;
            if (!ukey) { console.log('UNIPASS_KEY 없음 - 과세환율 수집 생략'); return; }
            const hosts = ['https://unipass.customs.go.kr:38010', 'https://unipass.customs.go.kr'];
            async function customs(imexTp) {
              let lastErr;
              for (const h of hosts) {
                try {
                  const xml = await fetchText(`${h}/ext/rest/trifFxrtInfoQry/retrieveTrifFxrtInfo?crkyCn=${ukey}&qryYymmDd=${ymd}&imexTp=${imexTp}`);
                  const items = [...xml.matchAll(/<trifFxrtInfoQryRsltVo>([\s\S]*?)<\/trifFxrtInfoQryRsltVo>/g)].map(m => {
                    const g = t => (m[1].match(new RegExp('<' + t + '>([^<]*)<')) || [])[1] || '';
                    return { unit: g('currSgn'), name: g('mtryUtNm'), rate: num(g('fxrt')), from: g('aplyBgnDt') };
                  }).filter(r => r.unit && r.rate !== null);
                  if (items.length) return items;
                  lastErr = new Error('관세청 응답에 항목 없음: ' + xml.slice(0, 200));
                } catch (e) { lastErr = e; }
              }
              throw lastErr;
            }
            try {
              const [imp, exp] = await Promise.all([customs(2), customs(1)]);
              const from = imp[0]?.from || '';
              const fromDash = from ? from.slice(0, 4) + '-' + from.slice(4, 6) + '-' + from.slice(6, 8) : '';
              let end = '';
              if (fromDash) { const d = new Date(fromDash + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 6); end = d.toISOString().slice(0, 10); }
              const cdoc = { week_start: fromDash, week_end: end, fetched_at: nowIso, source: '관세청 UNI-PASS 환율정보조회 API',
                             import: imp.map(({ unit, name, rate }) => ({ unit, name, rate })), export: exp.map(({ unit, name, rate }) => ({ unit, name, rate })) };
              fs.mkdirSync(path.join(OUT, 'customs'), { recursive: true });
              fs.writeFileSync(path.join(OUT, 'customs', 'latest.json'), JSON.stringify(cdoc, null, 1));
              if (fromDash) fs.writeFileSync(path.join(OUT, 'customs', fromDash + '.json'), JSON.stringify(cdoc, null, 1));
              console.log(`과세환율 ${fromDash}~${end}: 수입 ${imp.length} · 수출 ${exp.length} 통화`);
            } catch (e) {
              /* 과세환율 실패는 전체 실패로 만들지 않는다. 매매기준율만이라도 올린다. */
              console.warn('과세환율 수집 실패 (계속 진행): ' + e.message);
            }
          })().catch(e => { console.error(e.message); process.exit(1); });
          EOF

      - name: fx-data 커밋 · 푸시
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 - 푸시 생략"
          else
            git commit -m "환율 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push origin fx-data
          fi
