name: 세무환율 수집 (fx-data)

# 하는 일
#   평일 오전(KST 11:30, 14:00 재시도) 한국수출입은행 환율 API 로 그날의 매매기준율·TTB·TTS 를 받고,
#   관세청 UNI-PASS 주간환율(과세환율·수출환율)을 받아 fx-data 브랜치에 JSON 으로 쌓는다.
#   웹앱(한백택스_세무환율_조회.html)은 raw.githubusercontent 로 이 브랜치를 읽는다.
#     latest.json               최신 영업일 매매기준율
#     daily/YYYY-MM-DD.json     일자별 매매기준율 누적
#     customs/latest.json       최신 주 과세환율·수출환율
#     customs/YYYY-MM-DD.json   주 시작일(일요일)별 과세환율 누적
#     series/index.json         통화 목록·수집 범위
#     series/<통화코드>.json     통화별 일별(매매기준율·TTB·TTS)·주간(과세환율·수출환율) 시계열
#
# 필요한 비밀값 (Settings → Secrets and variables → Actions)
#   KOREAEXIM_KEY  필수. 한국수출입은행 Open API 인증키 (https://www.koreaexim.go.kr/ir/HPHKIR020M01 에서 무료 발급, 일 1,000회)
#   관세청 주간환율은 UNI-PASS 공개 조회라 키가 필요 없다 (2026-09-09 확인).
#
# 과거 기간 일괄 수집 (backfill)
#   Actions 탭 → 이 워크플로 → Run workflow 에서 from/to 를 YYYYMMDD 로 넣는다. 예) from 20241202, to 20260909
#   수출입은행 일일 한도 1,000회를 넘지 않도록 한 번에 영업일 900일 이내로 나눠 실행한다.
#
# 배포 경로
#   이 파일은 볼트의 웹배포_공개용/.github/workflows/ 에 있고, 세무포털_배포.ps1 이 웹배포_공개용 트리를
#   공개 저장소 루트로 올리므로 공개 저장소에서는 .github/workflows/fx-collect.yml 이 된다.
#   fx-data 브랜치는 배포 스냅샷과 무관하게 이 워크플로만 갱신한다.

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 11:30 KST
    - cron: '0 5 * * 1-5'    # 14:00 KST (오전 실패·미고시 대비 재시도)
  workflow_dispatch:
    inputs:
      date:
        description: '수집일 (YYYYMMDD). 비우면 오늘(KST)'
        required: false
        default: ''
      from:
        description: '일괄 수집 시작일 (YYYYMMDD). to 와 함께 지정'
        required: false
        default: ''
      to:
        description: '일괄 수집 종료일 (YYYYMMDD)'
        required: false
        default: ''
      ecos_from:
        description: '한국은행 ECOS 과거 매매기준율 수집 시작일 (YYYYMMDD). ECOS_KEY 비밀값 필요, ecos_to 와 함께'
        required: false
        default: ''
      ecos_to:
        description: 'ECOS 수집 종료일 (YYYYMMDD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fx-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: fx-data 브랜치 준비
        run: |
          git config user.name  "hanbaektax-fx-bot"
          git config user.email "hb090@hanbaektax.kr"
          if git ls-remote --exit-code --heads origin fx-data >/dev/null 2>&1; then
            git fetch origin fx-data
            git worktree add data origin/fx-data
            git -C data checkout -B fx-data origin/fx-data
          else
            git worktree add --detach data
            git -C data checkout --orphan fx-data
            git -C data rm -rfq .
            printf '# fx-data\n\n세무환율 조회 앱이 읽는 환율 데이터 브랜치. 워크플로 fx-collect.yml 이 자동 갱신한다.\n' > data/README.md
          fi

      - name: 환율 수집
        env:
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
          TARGET_DATE: ${{ github.event.inputs.date }}
          RANGE_FROM: ${{ github.event.inputs.from }}
          RANGE_TO: ${{ github.event.inputs.to }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          ECOS_FROM: ${{ github.event.inputs.ecos_from }}
          ECOS_TO: ${{ github.event.inputs.ecos_to }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const OUT = 'data';
          const key = process.env.KOREAEXIM_KEY;
          if (!key) { console.error('KOREAEXIM_KEY 비밀값이 없습니다. 수출입은행 인증키를 등록하십시오.'); process.exit(1); }

          const num = s => { const v = parseFloat(String(s ?? '').replace(/,/g, '')); return isNaN(v) ? null : v; };
          const nowIso = new Date().toISOString();
          const toDash = ymd => ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8);
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          /* ── 수집 대상 일자 ── */
          const kstToday = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10).replace(/-/g, '');
          const from = (process.env.RANGE_FROM || '').trim(), to = (process.env.RANGE_TO || '').trim();
          const ecosFrom = (process.env.ECOS_FROM || '').trim(), ecosTo = (process.env.ECOS_TO || '').trim();
          const ecosOnly = !!(ecosFrom && ecosTo && !(from && to) && !(process.env.TARGET_DATE || '').trim());
          let days = [];
          if (ecosOnly) {
            /* ECOS 만 수집하는 실행: 수출입은행 호출은 하지 않는다 */
          } else if (from && to) {
            if (!/^\d{8}$/.test(from) || !/^\d{8}$/.test(to) || from > to) { console.error('from/to 형식 오류 (YYYYMMDD, from <= to)'); process.exit(1); }
            for (let d = new Date(toDash(from) + 'T00:00:00Z'); d.toISOString().slice(0, 10).replace(/-/g, '') <= to; d.setUTCDate(d.getUTCDate() + 1)) {
              const dow = d.getUTCDay();
              if (dow !== 0 && dow !== 6) days.push(d.toISOString().slice(0, 10).replace(/-/g, ''));
            }
            if (days.length > 900) { console.error(`영업일 ${days.length}일은 일일 한도(1,000회)에 걸립니다. 900일 이내로 나눠 실행하십시오.`); process.exit(1); }
          } else {
            days = [(process.env.TARGET_DATE || '').trim() || kstToday];
          }
          if (days.length) console.log(`수집 대상: ${days.length}일 (${toDash(days[0])} ~ ${toDash(days[days.length - 1])})`);

          async function fetchText(url) {
            const r = await fetch(url, { headers: { 'User-Agent': 'hanbaektax-fx-collect' } });
            if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url.replace(/authkey=[^&]+/g, 'authkey=***'));
            return r.text();
          }
          function writeIfNewer(file, doc, dateKey) {
            let prev = '';
            try { prev = JSON.parse(fs.readFileSync(file, 'utf8'))[dateKey] || ''; } catch (e) {}
            if (doc[dateKey] >= prev) fs.writeFileSync(file, JSON.stringify(doc, null, 1));
          }

          /* ── 1) 수출입은행 AP01: 매매기준율 · TTB · TTS ── */
          async function exim(ymd) {
            const raw = await fetchText(`https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON?authkey=${key}&searchdate=${ymd}&data=AP01`);
            let arr; try { arr = JSON.parse(raw); } catch (e) { throw new Error('수출입은행 응답이 JSON 이 아닙니다: ' + raw.slice(0, 200)); }
            if (!Array.isArray(arr)) throw new Error('수출입은행 응답 형식 오류');
            if (arr.length === 0) return null;                       /* 비영업일 또는 미고시 */
            if (arr[0].result !== 1) throw new Error('수출입은행 result=' + arr[0].result + ' (2 DATA코드 오류, 3 인증코드 오류, 4 일일제한 초과)');
            /* base 는 서울외국환중개 매매기준율(kftc_deal_bas_r)을 우선하고, 없으면 수출입은행 매매기준율(deal_bas_r). 두 값을 모두 남긴다. */
            const rates = arr.map(r => ({ unit: r.cur_unit, name: r.cur_nm,
                                          base: num(r.kftc_deal_bas_r) ?? num(r.deal_bas_r), exim_base: num(r.deal_bas_r), kftc_base: num(r.kftc_deal_bas_r),
                                          ttb: num(r.ttb), tts: num(r.tts) }))
                             .filter(r => r.unit && r.unit !== 'KRW' && r.base !== null);
            return { date: toDash(ymd), source: '한국수출입은행 환율 API (AP01) · 매매기준율은 서울외국환중개(KFTC_DEAL_BAS_R) 값', fetched_at: nowIso, rates };
          }

          /* ── 2) 관세청 주간환율 — UNI-PASS 공개 조회(로그인·키 불필요, 2026-09-09 확인) ──
           * 정보조회 → 신고지원정보 → 주간환율 화면이 쓰는 JSON. weekFxrtTpcd 1=수출, 2=수입(과세). aplyDt 가 속한 주(일~토)를 돌려준다.
           * 응답: { aplyDtStrtDd, aplyDtEndDd, count, items:[{ currCd, currNm, intnCurrEnglNm, weekFxrt, beforeWeekFxrt }] }
           * 환율은 1 통화단위당 원(엔도 1엔 기준). */
          async function customsOne(dash, tpcd) {
            const raw = await fetchText(`https://unipass.customs.go.kr/csp/myc/bsopspptinfo/dclrSpptInfo/WeekFxrtQryCtr/retrieveWeekFxrt.do?pageIndex=1&pageUnit=100&aplyDt=${dash}&weekFxrtTpcd=${tpcd}`);
            let d; try { d = JSON.parse(raw); } catch (e) { throw new Error('관세청 응답이 JSON 이 아닙니다: ' + raw.slice(0, 200)); }
            const items = (d.items || []).map(r => ({ unit: r.currCd, name: r.currNm, name_en: r.intnCurrEnglNm, rate: num(r.weekFxrt), prev: num(r.beforeWeekFxrt) }))
                                          .filter(r => r.unit && r.unit !== 'KRW' && r.rate !== null);
            if (!items.length) throw new Error('관세청 응답에 항목 없음: ' + raw.slice(0, 200));
            return { start: d.aplyDtStrtDd || '', end: d.aplyDtEndDd || '', items };
          }
          async function customs(dash) {
            const [imp, exp] = await Promise.all([customsOne(dash, 2), customsOne(dash, 1)]);
            return { week_start: imp.start, week_end: imp.end, fetched_at: nowIso, unit_note: '원/1통화단위 (엔·루피아 포함)',
                     source: '관세청 UNI-PASS 주간환율 조회 (정보조회 › 신고지원정보 › 주간환율)', import: imp.items, export: exp.items };
          }

          (async () => {
            fs.mkdirSync(path.join(OUT, 'daily'), { recursive: true });
            fs.mkdirSync(path.join(OUT, 'customs'), { recursive: true });
            let saved = 0, skipped = 0, failed = 0;

            /* 매매기준율: 일자별 */
            for (const ymd of days) {
              try {
                const doc = await exim(ymd);
                if (!doc) { skipped++; if (days.length === 1) console.log(`${toDash(ymd)}: 고시 없음(비영업일 또는 미고시)`); }
                else {
                  fs.writeFileSync(path.join(OUT, 'daily', doc.date + '.json'), JSON.stringify(doc, null, 1));
                  writeIfNewer(path.join(OUT, 'latest.json'), doc, 'date');
                  saved++;
                  if (days.length === 1 || saved % 50 === 0) console.log(`${doc.date}: ${doc.rates.length} 통화 저장. USD 매매기준율 ${doc.rates.find(r => r.unit === 'USD')?.base}`);
                }
              } catch (e) {
                failed++; console.error(`${toDash(ymd)}: ${e.message}`);
                if (/result=[34]/.test(e.message)) { console.error('인증키 또는 일일 한도 문제로 중단합니다.'); break; }
              }
              if (days.length > 1) await sleep(250);
            }
            if (days.length) console.log(`매매기준율: 저장 ${saved} · 고시없음 ${skipped} · 실패 ${failed}`);
            if (days.length && saved === 0 && failed > 0) process.exit(1);

            /* ── 1-1) 한국은행 ECOS 과거 매매기준율 (선택) ──
             * 통계표 731Y001 "주요국 통화의 대원화환율"(일별). 수출입은행 API 의 일일 한도(1,000회)를 피해 오래된 연도를 채운다.
             * 매매기준율(USD·위안)·재정환율만 있고 TTB/TTS 는 없다. 수출입은행 수집본이 이미 있는 날짜는 건드리지 않는다.
             * 호출: https://ecos.bok.or.kr/api/StatisticSearch/{KEY}/json/kr/1/1000/731Y001/D/{from}/{to}/{item}
             * 응답: { StatisticSearch: { list_total_count, row:[{ TIME:'20230102', DATA_VALUE:'1267.3', ... }] } }
             * 2026-09-09 검증: 20260909 USD 1341.1 = 수출입은행 KFTC 매매기준율과 일치 */
            const ecosKey = process.env.ECOS_KEY;
            if (ecosFrom && ecosTo) {
              if (!ecosKey) { console.error('ecos_from/ecos_to 를 지정했지만 ECOS_KEY 비밀값이 없습니다.'); process.exit(1); }
              if (!/^\d{8}$/.test(ecosFrom) || !/^\d{8}$/.test(ecosTo) || ecosFrom > ecosTo) { console.error('ecos_from/ecos_to 형식 오류'); process.exit(1); }
              const ECOS_ITEMS = [
                ['USD', '0000001', '미국 달러'], ['JPY(100)', '0000002', '일본 옌'], ['EUR', '0000003', '유로'], ['CNH', '0000053', '위안화'],
                ['GBP', '0000012', '영국 파운드'], ['CAD', '0000013', '캐나다 달러'], ['CHF', '0000014', '스위스 프랑'], ['AUD', '0000017', '호주 달러'],
                ['NZD', '0000026', '뉴질랜드 달러'], ['HKD', '0000015', '홍콩 달러'], ['THB', '0000028', '태국 바트'], ['SGD', '0000024', '싱가포르 달러'],
                ['IDR(100)', '0000029', '인도네시아 루피아'], ['MYR', '0000025', '말레이지아 링기트'], ['BND', '0000036', '브루나이 달러'],
                ['SEK', '0000016', '스웨덴 크로나'], ['DKK', '0000018', '덴마아크 크로네'], ['NOK', '0000019', '노르웨이 크로네'],
                ['SAR', '0000020', '사우디 리얄'], ['KWD', '0000021', '쿠웨이트 디나르'], ['BHD', '0000022', '바레인 디나르'], ['AED', '0000023', '아랍에미리트 디르함'],
              ];
              /* 1회 1,000행 한도 → 연 단위로 나눠 호출 */
              const chunks = [];
              for (let y = +ecosFrom.slice(0, 4); y <= +ecosTo.slice(0, 4); y++) {
                const a = Math.max(+ecosFrom, y * 10000 + 101), b = Math.min(+ecosTo, y * 10000 + 1231);
                if (a <= b) chunks.push([String(a), String(b)]);
              }
              const byDate = {};
              let calls = 0, rowsTotal = 0;
              for (const [unit, item, name] of ECOS_ITEMS) {
                for (const [a, b] of chunks) {
                  try {
                    const raw = await fetchText(`https://ecos.bok.or.kr/api/StatisticSearch/${ecosKey}/json/kr/1/1000/731Y001/D/${a}/${b}/${item}`);
                    let d; try { d = JSON.parse(raw); } catch (e) { throw new Error('ECOS 응답이 JSON 이 아닙니다: ' + raw.slice(0, 120)); }
                    if (d.RESULT) throw new Error(`ECOS ${d.RESULT.CODE}: ${String(d.RESULT.MESSAGE).split('\n')[0]}`);
                    const rows = (d.StatisticSearch && d.StatisticSearch.row) || [];
                    for (const r of rows) { const v = num(r.DATA_VALUE); if (v === null || !/^\d{8}$/.test(r.TIME)) continue; (byDate[r.TIME] ||= []).push({ unit, name, base: v, ttb: null, tts: null }); rowsTotal++; }
                    calls++;
                  } catch (e) {
                    console.error(`ECOS ${unit} ${a}~${b}: ${e.message}`);
                    if (/ECOS (INFO-100|ERROR-1)/.test(e.message)) { console.error('ECOS 인증키 문제로 중단합니다.'); process.exit(1); }
                  }
                  await sleep(200);
                }
              }
              let ecosSaved = 0, ecosKept = 0;
              for (const ymd of Object.keys(byDate).sort()) {
                const file = path.join(OUT, 'daily', toDash(ymd) + '.json');
                if (fs.existsSync(file)) { ecosKept++; continue; }   /* 수출입은행 수집본 우선 */
                const doc = { date: toDash(ymd), source: '한국은행 ECOS 731Y001 주요국 통화의 대원화환율 (매매기준율·재정환율, TTB/TTS 없음)', fetched_at: nowIso, rates: byDate[ymd] };
                fs.writeFileSync(file, JSON.stringify(doc, null, 1)); ecosSaved++;
              }
              console.log(`ECOS: 호출 ${calls} · 행 ${rowsTotal} · 저장 ${ecosSaved}일 · 기존 수집본 유지 ${ecosKept}일 (${toDash(ecosFrom)}~${toDash(ecosTo)})`);
            }

            /* 과세환율: 주(일요일 시작)별 한 번씩 (ECOS 전용 실행에서는 생략) */
            const weeks = [...new Set(days.map(ymd => { const d = new Date(toDash(ymd) + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d.toISOString().slice(0, 10); }))];
            let cs = 0, cf = 0;
            for (const sunday of weeks) {
              try {
                const cdoc = await customs(sunday);
                if (cdoc.week_start) fs.writeFileSync(path.join(OUT, 'customs', cdoc.week_start + '.json'), JSON.stringify(cdoc, null, 1));
                writeIfNewer(path.join(OUT, 'customs', 'latest.json'), cdoc, 'week_start');
                cs++;
                if (weeks.length === 1 || cs % 20 === 0) console.log(`과세환율 ${cdoc.week_start}~${cdoc.week_end}: 수입 ${cdoc.import.length} · 수출 ${cdoc.export.length} 통화. USD 과세환율 ${cdoc.import.find(r => r.unit === 'USD')?.rate}`);
              } catch (e) {
                /* 과세환율 실패는 전체 실패로 만들지 않는다. 매매기준율만이라도 올린다. */
                cf++; console.warn(`과세환율 ${sunday} 실패 (계속 진행): ${e.message}`);
              }
              if (weeks.length > 1) await sleep(250);
            }
            if (weeks.length) console.log(`과세환율: 저장 ${cs} 주 · 실패 ${cf} 주`);

            /* ── 3) 통화별 시계열 파일 — 앱의 "통화별 기간 조회"용. 매 실행마다 daily/·customs/ 전체를 다시 훑어 만든다 ──
             * series/index.json          { updated, daily_from, daily_to, weekly_from, weekly_to, currencies:[{code, unit, name, daily, weekly}] }
             * series/<code>.json         { code, unit, name, daily:[[date, base, ttb, tts]...], weekly:[[week_start, week_end, import, export]...] }
             * code 는 통화코드(JPY(100) → JPY). 관세청 CNY 는 수출입은행 CNH 시계열에 붙인다. */
            const codeOf = unit => String(unit).replace(/\(.*\)$/, '');
            const series = {};
            const listDated = dir => fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => /^\d{4}-\d{2}-\d{2}\.json$/.test(f)).sort() : [];
            const dailyFiles = listDated(path.join(OUT, 'daily'));
            for (const f of dailyFiles) {
              let doc; try { doc = JSON.parse(fs.readFileSync(path.join(OUT, 'daily', f), 'utf8')); } catch (e) { continue; }
              for (const r of doc.rates || []) {
                const c = codeOf(r.unit);
                (series[c] ||= { code: c, unit: r.unit, name: r.name, daily: [], weekly: [] }).daily.push([doc.date, r.base, r.ttb, r.tts]);
              }
            }
            const weekFiles = listDated(path.join(OUT, 'customs'));
            for (const f of weekFiles) {
              let doc; try { doc = JSON.parse(fs.readFileSync(path.join(OUT, 'customs', f), 'utf8')); } catch (e) { continue; }
              const exp = new Map((doc.export || []).map(r => [r.unit, r.rate]));
              for (const r of doc.import || []) {
                const c = (r.unit === 'CNY' && series.CNH) ? 'CNH' : r.unit;
                (series[c] ||= { code: c, unit: c, name: r.name, daily: [], weekly: [] }).weekly.push([doc.week_start, doc.week_end, r.rate, exp.get(r.unit) ?? null]);
              }
            }
            const codes = Object.keys(series);
            if (codes.length) {
              fs.mkdirSync(path.join(OUT, 'series'), { recursive: true });
              for (const c of codes) fs.writeFileSync(path.join(OUT, 'series', c + '.json'), JSON.stringify(series[c]));
              const allDaily = dailyFiles.map(f => f.slice(0, 10)), allWeek = weekFiles.map(f => f.slice(0, 10));
              const index = { updated: nowIso, daily_from: allDaily[0] || '', daily_to: allDaily[allDaily.length - 1] || '', weekly_from: allWeek[0] || '', weekly_to: allWeek[allWeek.length - 1] || '',
                              currencies: codes.sort().map(c => ({ code: c, unit: series[c].unit, name: series[c].name, daily: series[c].daily.length, weekly: series[c].weekly.length })) };
              fs.writeFileSync(path.join(OUT, 'series', 'index.json'), JSON.stringify(index, null, 1));
              console.log(`시계열: ${codes.length} 통화 · 일별 ${allDaily.length}일 (${index.daily_from}~${index.daily_to}) · 주간 ${allWeek.length}주`);
            }
          })().catch(e => { console.error(e.message); process.exit(1); });
          EOF

      - name: fx-data 커밋 · 푸시
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 - 푸시 생략"
          else
            git commit -m "환율 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # 실행 중 다른 실행이 먼저 푸시했을 수 있다. 최신 브랜치 위에 얹고(충돌 시 이번 수집분 우선) 푸시한다.
            git fetch origin fx-data
            git rebase -X theirs origin/fx-data || { git rebase --abort; echo "리베이스 실패 - 강제 없이 중단"; exit 1; }
            git push origin fx-data
          fi
